<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مارد · كلام</title>
<meta name="description" content="اتكلم أي لغة مع مارد زي مكالمة: يصحّحلك، ويقيس نطقك، ويعرف مستواك من A1 لـ C2.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="talk.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mared">
<!--
  Mared's language talk on a phone (Hassan, 29 Oct 2026: "when people use the shortcut on their phones, they could just
  open it up, speak to it, have the conversation like a phone call"). The same free talk as the Windows app: the mic
  stays open, ElevenLabs' live transcriber ends each turn on a pause, the practice function answers and scores the
  voice, the voice function speaks. Progress, levels and cards are the server's, the same on both.
  Laid out as an iPhone app (Hassan, 30 Oct 2026: "the mobile app is visually terrible"; native SwiftUI later): the
  phone's own font, large titles, a tab bar, grouped cards, and a full-screen call while talking.
-->
<style>
  :root {
    --bg: #f2f2f7; --card: #ffffff; --fill: rgba(118, 118, 128, 0.12); --line: rgba(60, 60, 67, 0.16);
    --ink: #000000; --muted: rgba(60, 60, 67, 0.62); --tint: #9a6a17; --on-tint: #ffffff; --bad: #d70015;
    --again: #d70015; --hard: #b35300; --good: #9a6a17; --easy: #0060df; --on-grade: #ffffff;
    --bar: rgba(249, 249, 249, 0.86);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Arabic", "Segoe UI", Roboto, "Noto Sans Arabic", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000; --card: #1c1c1e; --fill: rgba(118, 118, 128, 0.24); --line: rgba(84, 84, 88, 0.6);
      --ink: #ffffff; --muted: rgba(235, 235, 245, 0.6); --tint: #e0b45c; --on-tint: #1a1405; --bad: #ff6961;
      --again: #ff6961; --hard: #ffb340; --good: #e0b45c; --easy: #6cb4ff; --on-grade: #000000;
      --bar: rgba(22, 22, 24, 0.86);
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.4; -webkit-text-size-adjust: 100%; }
  body { min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }
  :focus-visible { outline: 3px solid var(--tint); outline-offset: 2px; }

  /* Screens: a large title, content in grouped cards, room for the tab bar below */
  .screen { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 96px); }
  .large { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.15; margin: 6px 4px 14px; }
  .caption { font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em; margin: 22px 16px 6px; }
  :lang(ar) .caption, [dir="rtl"] .caption { text-transform: none; letter-spacing: 0; }
  .group { background: var(--card); border-radius: 12px; overflow: hidden; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 6px 16px; position: relative; }
  .row + .row::before { content: ""; position: absolute; top: 0; inset-inline: 16px 0; border-top: 0.5px solid var(--line); }
  .row > .grow { flex: 1; min-width: 0; }
  .row small { display: block; color: var(--muted); font-size: 13px; }
  .row select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: var(--muted); text-align: end; padding: 8px 0; max-width: 60%; }
  .row .chev { color: var(--muted); font-size: 14px; }
  .linkrow { width: 100%; border: 0; background: none; text-align: start; color: var(--tint); }
  .linkrow.bad { color: var(--bad); }

  /* An iOS switch, for "talk over me" */
  .switch { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--fill); position: relative; transition: background 0.2s; flex: none; margin: 0; }
  .switch::after { content: ""; position: absolute; top: 2px; inset-inline-start: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2); transition: transform 0.2s; }
  .switch:checked { background: #34c759; }
  .switch:checked::after { transform: translateX(20px); }
  [dir="rtl"] .switch:checked::after { transform: translateX(-20px); }

  /* Buttons */
  .primary { display: block; width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: var(--tint); color: var(--on-tint); font-weight: 600; }
  .primary:disabled { opacity: 0.5; }
  .secondary { display: block; width: 100%; min-height: 50px; border: 0; border-radius: 12px; background: var(--card); color: var(--ink); font-weight: 600; }
  .plain { border: 0; background: none; color: var(--tint); min-height: 44px; padding: 0 8px; }
  .chip { flex: none; min-height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: var(--card); color: var(--ink); font-size: 15px; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  input[type="email"], input[inputmode="numeric"] { width: 100%; min-height: 50px; padding: 0 16px; border: 0; border-radius: 12px; background: var(--card); }
  input[aria-invalid] { box-shadow: inset 0 0 0 2px var(--bad); }
  .err { color: var(--bad); font-size: 15px; min-height: 1.4em; margin: 6px 4px; }

  /* Sign in */
  .welcome { text-align: center; padding-top: 8vh; }
  .welcome img { width: 84px; height: 84px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12); }
  .welcome .large { margin: 18px 0 8px; }
  .welcome p { margin: 0 12px 26px; }
  .stack > * + * { margin-top: 10px; }

  /* Talk (before the call) */
  .streak { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px; border-radius: 14px; background: var(--card); font-size: 15px; font-weight: 600; margin: 0 4px; }
  .topics { display: flex; gap: 8px; overflow-x: auto; padding: 2px 4px 6px; margin: 0 -16px; padding-inline: 16px; scrollbar-width: none; }
  .topics::-webkit-scrollbar { display: none; }
  .start { display: grid; place-items: center; gap: 12px; padding: 34px 0 10px; }
  .orb { width: 168px; height: 168px; border-radius: 50%; border: 0; color: var(--on-tint); font-size: 20px; font-weight: 700;
    background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--tint) 70%, #fff), var(--tint) 62%);
    box-shadow: 0 18px 40px color-mix(in srgb, var(--tint) 35%, transparent), inset 0 -6px 18px rgba(0, 0, 0, 0.12); display: grid; place-items: center; transition: transform 0.15s; }
  .orb:active { transform: scale(0.96); }
  .orb svg { width: 44px; height: 44px; }
  .hint { text-align: center; font-size: 15px; margin: 6px 24px; }
  .note { text-align: center; font-size: 13px; margin: 18px 24px 0; }

  /* The call: full screen, always dark, as a phone call */
  .call { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; color: #fff;
    background: radial-gradient(120% 80% at 50% 20%, #26304a 0%, #0b0f19 55%, #000 100%);
    padding: calc(env(safe-area-inset-top) + 14px) 20px calc(env(safe-area-inset-bottom) + 22px); }
  .call-top { text-align: center; }
  .call-top b { display: block; font-size: 17px; }
  .call-top span { font-size: 15px; color: rgba(255, 255, 255, 0.6); }
  .voice { position: relative; width: 150px; height: 150px; margin: 4vh auto 2vh; flex: none; }
  .voice i { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #f6d98f, #c9952f 60%, #7a5412); transform: scale(calc(1 + var(--lvl, 0) * 0.35)); transition: transform 0.08s linear; }
  .voice::before, .voice::after { content: ""; position: absolute; inset: -14px; border-radius: 50%; border: 2px solid rgba(240, 200, 110, 0.5); opacity: 0; }
  .call[data-state="speaking"] .voice::before, .call[data-state="speaking"] .voice::after { animation: ring 1.4s ease-out infinite; }
  .call[data-state="speaking"] .voice::after { animation-delay: 0.7s; }
  .call[data-state="thinking"] .voice i { animation: think 1.2s ease-in-out infinite; }
  .call[data-state="listening"] .voice i { box-shadow: 0 0 calc(20px + var(--lvl, 0) * 60px) rgba(240, 200, 110, 0.55); }
  @keyframes ring { from { transform: scale(0.92); opacity: 0.8; } to { transform: scale(1.35); opacity: 0; } }
  @keyframes think { 50% { transform: scale(0.9); opacity: 0.75; } }
  @media (prefers-reduced-motion: reduce) { .voice i, .voice::before, .voice::after { animation: none !important; transition: none; } }
  .status { text-align: center; font-size: 15px; color: rgba(255, 255, 255, 0.7); min-height: 1.4em; }
  .words-now { flex: 1; overflow-y: auto; margin: 2vh 0; text-align: center; }
  .say { font-size: 18px; color: rgba(255, 255, 255, 0.82); }
  .line { direction: ltr; font-size: 28px; font-weight: 700; line-height: 1.25; margin-top: 14px; }
  .gloss { color: rgba(255, 255, 255, 0.6); margin-top: 4px; }
  .fix { color: #f0c86e; font-weight: 600; margin-top: 14px; }
  .heard { color: rgba(255, 255, 255, 0.55); font-style: italic; margin-top: 16px; min-height: 1.4em; }
  .call-bottom { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
  .hangup { width: 72px; height: 72px; border-radius: 50%; border: 0; background: #ff3b30; color: #fff; display: grid; place-items: center; }
  .hangup svg { width: 32px; height: 32px; }
  .over { justify-self: center; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: rgba(255, 255, 255, 0.7); border: 0; background: none; }
  .over span:first-child { width: 52px; height: 52px; border-radius: 50%; background: rgba(255, 255, 255, 0.16); display: grid; place-items: center; font-size: 20px; }
  .over[aria-pressed="true"] span:first-child { background: #fff; color: #000; }

  /* Review */
  .counts { display: flex; gap: 8px; margin: 0 4px 14px; }
  .counts span { flex: 1; text-align: center; background: var(--card); border-radius: 12px; padding: 8px 0; font-size: 13px; color: var(--muted); }
  .counts b { display: block; font-size: 22px; color: var(--ink); }
  .flash { background: var(--card); border-radius: 16px; padding: 22px 20px; min-height: 280px; display: flex; flex-direction: column; }
  .flash .deck { font-size: 13px; color: var(--muted); }
  .flash .front { font-size: 30px; font-weight: 700; margin: 26px 0 8px; text-align: center; }
  .flash .back { font-size: 21px; text-align: center; margin: 4px 0 18px; }
  .flash hr { border: 0; border-top: 0.5px solid var(--line); margin: 16px 0; width: 100%; }
  .flash .hear { align-self: center; }
  .flash .spacer { flex: 1; }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grades button { min-height: 60px; border: 0; border-radius: 12px; color: var(--on-grade); font-weight: 600; line-height: 1.25; font-size: 15px; }
  .grades button:nth-child(1) { background: var(--again); } .grades button:nth-child(2) { background: var(--hard); }
  .grades button:nth-child(3) { background: var(--good); } .grades button:nth-child(4) { background: var(--easy); }
  .grades small { display: block; font-weight: 400; opacity: 0.85; font-size: 12px; }
  .done { text-align: center; padding: 40px 20px; }

  /* You: level, progress, settings */
  .level { background: var(--card); border-radius: 16px; padding: 18px; }
  .ladder { display: flex; gap: 4px; direction: ltr; margin: 14px 0; }
  .ladder span { flex: 1; text-align: center; padding: 7px 0; border-radius: 8px; background: var(--fill); font-size: 13px; font-weight: 600; color: var(--muted); }
  .ladder .on { background: var(--tint); color: var(--on-tint); }
  .ladder .aim { box-shadow: inset 0 0 0 2px var(--tint); }
  .level select { width: 100%; min-height: 44px; border: 0; border-radius: 10px; background: var(--fill); padding: 0 12px; margin: 4px 0 6px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--card); border-radius: 14px; padding: 14px; }
  .tile b { display: block; font-size: 26px; font-weight: 700; }
  .tile span { font-size: 13px; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 28px; margin-top: 10px; direction: ltr; }
  .bars i { flex: 1; background: var(--tint); border-radius: 2px; min-height: 2px; }
  .bars i.zero { background: var(--fill); }
  .week { text-align: center; font-size: 15px; margin: 12px 8px 0; }
  .words { display: flex; flex-wrap: wrap; gap: 8px; }
  .words button { direction: ltr; }

  /* The tab bar */
  .tabbar { position: fixed; inset-inline: 0; bottom: 0; z-index: 10; display: flex; justify-content: space-around; background: var(--bar);
    -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: 0.5px solid var(--line);
    padding: 6px 0 calc(env(safe-area-inset-bottom) + 4px); }
  .tabbar button { flex: 1; max-width: 140px; border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 10px; font-weight: 500; padding: 2px 0; position: relative; }
  .tabbar svg { width: 26px; height: 26px; }
  .tabbar [aria-selected="true"] { color: var(--tint); }
  .badge { position: absolute; top: -2px; inset-inline-start: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ff3b30; color: #fff; font-size: 12px; line-height: 18px; }
</style>
</head>
<body>

<!-- Sign in: the 6-digit code from the email, or Google -->
<section id="s-in" class="screen" hidden>
  <div class="welcome">
    <img src="icon.png" alt="">
    <h1 class="large" id="t-in-h">اتكلم أي لغة زي مكالمة</h1>
    <p class="muted" id="t-in-p">سجّل بنفس حساب مارد اللي على الكمبيوتر، وتقدّمك يبقى واحد هنا وهناك.</p>
  </div>
  <button class="secondary" type="button" id="google" hidden style="margin-bottom:12px">Google</button>
  <form id="email-form" class="stack" novalidate>
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@gmail.com" dir="ltr" aria-label="Email">
    <div class="err" id="email-err" role="alert"></div>
    <button class="primary" type="submit" id="t-send">ابعتلي كود</button>
  </form>
  <form id="code-form" class="stack" novalidate hidden>
    <p id="t-code-p" style="margin:0 4px">بعتنالك كود من 6 أرقام على الإيميل. اكتبه هنا.</p>
    <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr" aria-label="Code">
    <div class="err" id="code-err" role="alert"></div>
    <button class="primary" type="submit" id="t-verify">ادخل</button>
    <button class="plain" type="button" id="again" style="width:100%">إيميل تاني</button>
  </form>
  <div style="text-align:center;margin-top:24px"><button class="plain" id="lang" type="button">English</button></div>
</section>

<div id="s-talk" hidden>
  <!-- Talk: pick the language and a topic, then the call -->
  <section id="talk" class="screen">
    <h1 class="large" id="t-talk-h">كلام</h1>
    <p style="margin:0 0 14px"><span class="streak" id="streak"></span></p>
    <div class="group">
      <label class="row"><span class="grow" id="t-learn">بتتعلم إيه؟</span><select id="learn"></select><span class="chev" aria-hidden="true">⌄</span></label>
    </div>
    <div class="caption" id="t-topic">موضوع</div>
    <div class="topics" id="chips"></div>
    <div class="start">
      <button class="orb" id="orb" type="button" aria-label="ابدأ"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg></button>
      <div class="hint" id="t-start">دوس وابدأ الكلام</div>
      <div class="hint muted" id="after" role="status"></div>
    </div>
    <p class="muted note" id="t-home">اعمل الصفحة دي اختصار على الشاشة الرئيسية: من قايمة المتصفح، «إضافة للشاشة الرئيسية».</p>
  </section>

  <!-- Review: the deck, as Anki (027) -->
  <section id="review" class="screen" hidden>
    <h1 class="large" id="t-review-h">مراجعة</h1>
    <div class="counts" id="counts"></div>
    <div class="flash" id="rv-card">
      <div class="deck" id="rv-deck"></div>
      <div class="front" id="rv-front"></div>
      <button class="plain hear" type="button" id="rv-hear" hidden aria-label="🔊">🔊</button>
      <div class="spacer"></div>
      <div id="rv-answer" hidden>
        <hr>
        <div class="back" id="rv-back"></div>
        <div class="grades" id="rv-grades"></div>
      </div>
      <button class="primary" type="button" id="rv-show"></button>
    </div>
    <p class="muted done" id="rv-done" hidden></p>
  </section>

  <!-- You: level, progress, words, settings -->
  <section id="me" class="screen" hidden>
    <h1 class="large" id="t-me-h">تقدّمك</h1>
    <div class="level" id="level"></div>
    <div id="progress"></div>
    <div class="caption" id="t-settings">الإعدادات</div>
    <div class="group">
      <label class="row"><span class="grow"><span id="t-barge">تقدر تقاطعني</span><small id="t-barge-sub"></small></span><input type="checkbox" class="switch" id="barge"></label>
      <div class="row"><button class="linkrow" type="button" id="lang2"></button></div>
      <div class="row"><button class="linkrow bad" type="button" id="signout"></button></div>
    </div>
  </section>

  <!-- The call -->
  <div class="call" id="call" hidden data-state="thinking" aria-live="polite">
    <div class="call-top"><b id="call-lang"></b><span id="call-topic"></span></div>
    <div class="voice" aria-hidden="true"><i></i></div>
    <div class="status" id="status" role="status"></div>
    <div class="words-now" id="turn">
      <div class="say" id="say" dir="auto"></div>
      <div class="line" id="line" lang="en"></div>
      <div class="gloss" id="gloss" dir="auto"></div>
      <div class="fix" id="fix" dir="auto"></div>
      <div class="heard" id="heard" dir="auto"></div>
    </div>
    <div class="call-bottom">
      <span></span>
      <button class="hangup" type="button" id="hangup" aria-label="إنهاء"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85a.99.99 0 0 1-1.4-.01L.29 13.08a1 1 0 0 1 0-1.41C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67a1 1 0 0 1 0 1.41l-2.48 2.48a.99.99 0 0 1-1.4.01 11.3 11.3 0 0 0-2.67-1.85.99.99 0 0 1-.56-.9v-3.1A15.3 15.3 0 0 0 12 9Z"/></svg></button>
      <button class="over" type="button" id="over" aria-pressed="true"><span aria-hidden="true">✋</span><span id="t-over">قاطعني</span></button>
    </div>
  </div>

  <nav class="tabbar" role="tablist">
    <button type="button" role="tab" id="tab-talk" aria-selected="true"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg><span id="t-tab-talk">كلام</span></button>
    <button type="button" role="tab" id="tab-review" aria-selected="false"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6Zm15 1.5 1.1.3a2 2 0 0 1 1.4 2.45l-2.3 8.7A2 2 0 0 1 19 19V7.5Z"/></svg><span id="t-tab-review">مراجعة</span><span class="badge" id="badge" hidden></span></button>
    <button type="button" role="tab" id="tab-me" aria-selected="false"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 20a1 1 0 0 1-1-1v-6a1 1 0 0 1 2 0v6a1 1 0 0 1-1 1Zm7 0a1 1 0 0 1-1-1V5a1 1 0 0 1 2 0v14a1 1 0 0 1-1 1Zm7 0a1 1 0 0 1-1-1v-9a1 1 0 0 1 2 0v9a1 1 0 0 1-1 1Z"/></svg><span id="t-tab-me">تقدّمك</span></button>
  </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>

  async function turn(ev, heard, audio) {
    const my = ++gen;
    busy = true; status(T("بفكّر…", "Thinking…")); orb("thinking");
    try {
      const t = await (await call("/functions/v1/practice", {
        mode: "talk", topic, course: "", lesson: "Talk", goal: "free conversation", notes: notes().join("\n").slice(-4000), learner: "",
        event: ev, heard, line, expect, history: history.slice(-4000), review: "", audio, dialect: dialect(), learn: tg()[0],
        day: new Date().toLocaleDateString("en-CA"), level: (levels[tg()[0]] || {}).level || "", aim: (levels[tg()[0]] || {}).aim || "",
      })).json();
      if (!live || my !== gen) return;
      if (ev === "answer") history += "Learner: " + heard + "\n";
      history += "Mared: " + t.say + (t.line ? " [line: " + t.line + "]" : "") + "\n";
      if (t.note) store.set("mared-talk-notes", [...notes(), t.note].slice(-40));
      if (t.topic) topic = t.topic;
      $("say").textContent = t.say; $("line").textContent = t.line || ""; $("gloss").textContent = t.gloss || "";
      let up = "";
      if (t.level) { // Mared judged a new level: kept by the server already
        const before = rank((levels[tg()[0]] || {}).level);
        levels[tg()[0]] = { ...(levels[tg()[0]] || {}), level: t.level }; paintLevel();
        if (rank(t.level) > before) up = before < 0 ? T(`مستواك: ${t.level}`, `Your level: ${t.level}`) : T(`🎉 مستواك بقى ${t.level}!`, `🎉 You're now ${t.level}!`);
      }
      $("fix").textContent = [up, t.fix ? "✓ " + t.fix : "", t.better ? T("أحلى: ", "Better: ") + t.better : ""].filter(Boolean).join(" · ");
      $("heard").textContent = "";
      line = t.line || ""; expect = t.expect || "reply";
      stucks = ev === "stuck" ? stucks : 0;
      orb("speaking"); status("");
      busy = false; // from here they may talk over Mared
      spokenNow = t.say + " " + (t.line || ""); cutNow = false;
      const first = voice(t.say, dialect() === "en" ? "en" : "ar"), second = t.line ? voice(t.line, tg()[1]) : null; // the second is made while the first plays
      await play(first);
      if (live && !cutNow && my === gen) await play(second);
      if (!live || my !== gen) return;
      if (cutNow) { orb(); status(T("سامعك…", "Listening…")); return; } // already talking: the same connection hears the rest
      turnPcm = []; turnLen = 0; quietUntil = performance.now() + 300;
      await listen(expect === "repeat" || expect === "answer" ? tg()[1] : (dialect() === "en" ? "en" : null));
      orb(); status(T("سامعك…", "Listening…"));
      lastHeardAt = Date.now();
      clearInterval(stuckTimer);
      stuckTimer = setInterval(() => {
        if (!live || busy || playing || Date.now() - lastHeardAt < STUCK_MS) return;
        clearInterval(stuckTimer);
        if (++stucks >= 3) end(T("هقفل المايك دلوقتي. دوس «ابدأ» لما تحب نكمّل.", "I'll close the mic now. Tap Start when you want to carry on."));
        else turn("stuck", "", null);
      }, 2000);
    } catch (e) {
      if (e.status === 402) end(T("اللي متاحلك خلص. اشترك من yamared.com/start ونكمّل.", "You've used what you had. Subscribe at yamared.com/start and we'll carry on."));
      else if (e.status === 401) { end(); await db.auth.signOut(); }
      else end(T("حصلت مشكلة في النت. دوس «ابدأ» نجرّب تاني.", "Something went wrong with the connection. Tap Start to try again."));
      return;
    } finally { busy = false; }
  }

  // One audio engine for the mic and Mared's voice, made (or woken) from a tap.
  function sound() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  let playingNow = null;
  const voice = (text, language, v) => (text ? call("/functions/v1/voice", { mode: "tts", text, language, ...(v ? { voice: v } : {}) }).then((r) => r.arrayBuffer()).catch(() => null) : null);
  const speak = (text, language, v) => play(voice(text, language, v));
  async function play(pending) {
    if (!pending) return;
    try {
      const mp3 = await pending;
      if (!mp3 || !ctx) return;
      const clip = await ctx.decodeAudioData(mp3);
      const src = ctx.createBufferSource();
      src.buffer = clip; src.connect(ctx.destination);
      playing = true; playingNow = src;
      await new Promise((done) => { src.onended = done; src.start(); });
    } catch (e) { /* no voice: the words are on the card */ }
    finally { playing = false; playingNow = null; quietUntil = performance.now() + 300; }
  }

  // ---- Progress: the server's, the same as the Windows app's ----
  async function progress() {
    const { data: p } = await db.rpc("speaking_stats", { p_days: 30 });
    const box = $("progress"); box.innerHTML = "";
    if (!p) return;
    const day = (d) => d.toLocaleDateString("en-CA");
    const today = new Date(), active = new Set(p.active_days || []);
    let streak = 0, d = new Date(today);
    if (!active.has(day(d))) d.setDate(d.getDate() - 1); // a streak that ended yesterday is still alive today
    while (active.has(day(d))) { streak++; d.setDate(d.getDate() - 1); }
    $("streak").textContent = streak > 0 ? T(`🔥 ${streak} يوم ورا بعض`, `🔥 ${streak} days in a row`) : T("دقيقتين النهارده وتبدأ سلسلتك", "Two minutes today starts your streak");
    if (!p.talks && !p.words_total) return;
    const days = [...Array(14)].map((_, i) => { const x = new Date(today); x.setDate(x.getDate() - 13 + i); return day(x); });
    const by = Object.fromEntries((p.days || []).map((x) => [x.day, x]));
    const per = (f) => days.map((x) => (by[x] ? f(by[x]) : 0));
    const learned = days.map((x) => (p.words || []).filter((w) => w.day === x).length);
    const tile = (n, name, values) => {
      const max = Math.max(1, ...values);
      return `<div class="tile"><b>${n}</b><span class="muted">${name}</span><div class="bars" aria-hidden="true">${values.map((v) => `<i class="${v ? "" : "zero"}" style="height:${Math.max(2, (v / max) * 30)}px"></i>`).join("")}</div></div>`;
    };
    box.innerHTML = `<div class="caption">${T("آخر أسبوعين", "Last two weeks")}</div><div class="tiles">` +
      tile(p.words_total, T("كلمة اتعلمتها", "words learned"), learned) + tile(p.words_spoken, T("كلمة قلتها", "words spoken"), per((x) => x.words_spoken)) +
      tile(p.talks, T("محادثة", "talks"), per((x) => x.talks)) + tile(Math.floor(p.seconds / 60), T("دقيقة بصوتك", "minutes of your voice"), per((x) => x.seconds / 60)) + `</div>`;
    // This week: the last 7 days, as the Windows app's weekly message.
    const week = days.slice(-7), sum = (f) => week.reduce((a, x) => a + (by[x] ? f(by[x]) : 0), 0);
    const newWords = (p.words || []).filter((w) => week.includes(w.day)).length;
    if (sum((x) => x.words_spoken) > 0) box.insertAdjacentHTML("beforeend", `<p class="muted week">${T(
      `الأسبوع ده: قلت ${sum((x) => x.words_spoken)} كلمة في ${sum((x) => x.talks)} محادثة، واتعلمت ${newWords} كلمة جديدة.`,
      `This week: ${sum((x) => x.words_spoken)} words in ${sum((x) => x.talks)} talks, and ${newWords} new words.`)}</p>`);
    if ((p.words || []).length) {
      const h = document.createElement("div"); h.className = "caption"; h.textContent = T("كلماتك: دوس تسمعها", "Your words: tap to hear");
      const list = document.createElement("div"); list.className = "words";
      for (const w of p.words.slice(0, 40)) {
        const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = w.gloss ? `${w.en} · ${w.gloss}` : w.en;
        b.addEventListener("click", () => { if (!live) { sound(); speak(w.en, tg()[1]); } });
        list.appendChild(b);
      }
      box.append(h, list);
    }
  }

  // ---- Review: the deck, scheduled as Anki does on the server (027); the same cards as the Windows app ----
  const wait = (s) => {
    const n = (x, d = 0) => Math.round(x * 10 ** d) / 10 ** d;
    if (s < 3600) return T(`${Math.max(1, n(s / 60))} دقيقة`, `${Math.max(1, n(s / 60))}m`);
    if (s < 86400) return T(`${n(s / 3600)} ساعة`, `${n(s / 3600)}h`);
    if (s < 30 * 86400) return T(`${n(s / 86400)} يوم`, `${n(s / 86400)}d`);
    if (s < 365 * 86400) return T(`${n(s / 2592000, 1)} شهر`, `${n(s / 2592000, 1)}mo`);
    return T(`${n(s / 31536000, 1)} سنة`, `${n(s / 31536000, 1)}y`);
  };
  const latin = (t) => (t.match(/[A-Za-z]/g) || []).length * 2 > (t.match(/\p{L}/gu) || []).length;
  let card = null, grading = false;
  function tab(name) {
    for (const n of ["talk", "review", "me"]) { $("tab-" + n).setAttribute("aria-selected", String(n === name)); $(n).hidden = n !== name; }
    scrollTo(0, 0);
    if (name === "review") nextCard();
    if (name === "me") { progress(); loadLevels(); }
  }
  for (const n of ["talk", "review", "me"]) $("tab-" + n).addEventListener("click", () => tab(n));
  async function nextCard() {
    let due = null;
    try { due = await (await call("/rest/v1/rpc/due_cards", { p_day: new Date().toLocaleDateString("en-CA"), p_limit: 20 })).json(); } catch (e) {}
    grading = false;
    const waiting = due ? due.new + due.learning + due.review : 0;
    $("badge").hidden = !waiting; $("badge").textContent = waiting > 99 ? "99+" : String(waiting);
    card = due?.cards?.[0] || null;
    $("rv-card").hidden = !card; $("rv-done").hidden = !!card;
    if (!due) { $("rv-done").textContent = T("مقدرتش أجيب الكروت. اتأكد من النت.", "Couldn't load your cards. Check the connection."); $("counts").textContent = ""; return; }
    $("counts").innerHTML = `<span><b style="color:var(--tint)">${due.new}</b>${T("جديد", "New")}</span><span><b>${due.learning}</b>${T("بتتعلمه", "Learning")}</span><span><b>${due.review}</b>${T("مراجعة", "To review")}</span>`;
    if (!card) {
      $("rv-done").textContent = due.total ? T(`خلّصت مراجعة النهارده 🎉 راجعت ${due.reviewed_today} كارت.`, `Done for today 🎉 You reviewed ${due.reviewed_today} cards.`)
        : T("لسه مفيش كروت. الكلمات اللي بتتعلمها في الكلام بتبقى كروت هنا لوحدها.", "No cards yet. Words you learn while talking become cards here by themselves.");
      return;
    }
    $("rv-deck").textContent = card.deck;
    $("rv-front").textContent = card.front; $("rv-front").dir = latin(card.front) ? "ltr" : "auto";
    $("rv-back").textContent = card.back; $("rv-back").dir = latin(card.back) ? "ltr" : "auto";
    $("rv-hear").hidden = !(ofDeck(card.deck) && card.kind === "word");
    $("rv-answer").hidden = true; $("rv-show").hidden = false; $("rv-show").textContent = T("وريني الإجابة", "Show answer");
    const names = [T("تاني", "Again"), T("صعب", "Hard"), T("تمام", "Good"), T("سهل", "Easy")];
    $("rv-grades").innerHTML = "";
    names.forEach((name, i) => {
      const b = document.createElement("button"); b.type = "button";
      b.innerHTML = `${name}<small>${wait(card.next[i] || 0)}</small>`;
      b.addEventListener("click", () => grade(i + 1));
      $("rv-grades").appendChild(b);
    });
  }
  async function grade(g) {
    if (!card || grading) return;
    grading = true;
    try { await call("/rest/v1/rpc/review_card", { p_id: card.id, p_grade: g, p_day: new Date().toLocaleDateString("en-CA") }); } catch (e) {}
    nextCard();
  }
  $("barge").addEventListener("change", (e) => { store.set("mared-talk-barge", e.target.checked); paint(); });
  $("over").addEventListener("click", () => { store.set("mared-talk-barge", !barge()); paint(); });
  $("rv-show").addEventListener("click", () => { $("rv-answer").hidden = false; $("rv-show").hidden = true; });
  $("rv-hear").addEventListener("click", () => { sound(); speak(card.front, (ofDeck(card.deck) || tg())[1]); });
  document.addEventListener("keydown", (e) => {
    if ($("review").hidden || !card || e.target.tagName === "INPUT") return;
    if ($("rv-answer").hidden) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); $("rv-show").click(); } return; }
    const g = { "1": 1, "2": 2, "3": 3, "4": 4, " ": 3, Enter: 3 }[e.key];
    if (g) { e.preventDefault(); grade(g); }
  });

  paint();
  db.auth.getSession().then(({ data }) => { session = data.session; $("s-in").hidden = !!session; $("s-talk").hidden = !session; if (session) { progress(); nextCard(); } });
})();
</script>
</body>
