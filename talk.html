<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مارد · إنجليزي</title>
<meta name="description" content="اتكلم إنجليزي مع مارد زي مكالمة: يصحّحلك، ويقيس نطقك، وكل يوم تعرف حاجة جديدة.">
<meta name="theme-color" content="#f7f3ea">
<link rel="manifest" href="talk.webmanifest">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mared">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Mared's English talk on a phone (Hassan, 29 Oct 2026: "when people use the shortcut on their phones, they could just
  open it up, speak to it, have the conversation like a phone call"). The same free talk as the Windows app: the mic
  stays open, ElevenLabs' live transcriber ends each turn on a short pause, the practice function answers (and scores
  the voice with Azure), the voice function speaks. Progress is the server's (speaking_stats), the same on both.
  Signs in with the 6-digit email code, so no redirect is needed. Saved to the home screen it opens like an app.
-->
<style>
  :root {
    --bg: #f7f3ea; --raised: #efe9dc; --line: #e2dacb; --field: #ffffff;
    --ink: #0a0f1e; --muted: #566074; --bad: #b3261e; --gold: #9a6a17; --on-action: #f7f3ea;
    --font: "Readex Pro", "Segoe UI", system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0a0f1e; --raised: #141b2e; --line: #252e45; --field: #141b2e; --ink: #f2ede2; --muted: #a3abbc; --bad: #ff8a80; --gold: #e0b45c; --on-action: #0a0f1e; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 1.0625rem; line-height: 1.6; }
  body { min-height: 100dvh; padding: env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px); -webkit-tap-highlight-color: transparent; }
  main { max-width: 520px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.15rem; }
  .brand img { width: 30px; height: 30px; border-radius: 8px; }
  button, input, select { font: inherit; color: inherit; }
  .pill { min-height: 44px; padding: 0 16px; border: 0; border-radius: 999px; background: var(--raised); cursor: pointer; }
  .primary { min-height: 52px; padding: 0 22px; border: 0; border-radius: 14px; background: var(--ink); color: var(--on-action); font-weight: 600; cursor: pointer; width: 100%; }
  .primary:disabled { opacity: 0.5; }
  input { width: 100%; min-height: 52px; padding: 0 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--field); }
  select { width: 100%; min-height: 48px; padding: 0 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--field); margin-bottom: 14px; }
  input[aria-invalid] { border-color: var(--bad); }
  .err { color: var(--bad); font-size: 0.92rem; min-height: 1.4em; }
  .muted { color: var(--muted); }
  .card { background: var(--raised); border: 1px solid var(--line); border-radius: 18px; padding: 18px; margin: 14px 0; }
  h1 { font-size: 1.6rem; margin: 8px 0 4px; line-height: 1.3; }
  .stack > * + * { margin-top: 10px; }
  /* The call */
  .call { display: grid; place-items: center; gap: 14px; padding: 18px 0 6px; }
  .orb { width: 132px; height: 132px; border-radius: 50%; border: 0; background: var(--ink); color: var(--on-action); font-size: 1.05rem; font-weight: 600; cursor: pointer; position: relative; }
  .orb.live { background: var(--gold); color: #0a0f1e; }
  .orb.live::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid var(--gold); opacity: 0; animation: ring 1.8s ease-out infinite; }
  .orb.speaking::after { animation-duration: 0.9s; }
  @keyframes ring { from { transform: scale(0.9); opacity: 0.7; } to { transform: scale(1.25); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .orb.live::after { animation: none; opacity: 0.5; } }
  .status { min-height: 1.6em; color: var(--muted); text-align: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chips .pill[aria-pressed="true"] { background: var(--ink); color: var(--on-action); }
  .say { font-size: 1.1rem; }
  .line { direction: ltr; text-align: left; font-size: 1.45rem; font-weight: 600; margin-top: 10px; }
  .gloss { color: var(--muted); }
  .fix { color: var(--gold); font-weight: 500; }
  .heard { direction: ltr; text-align: left; color: var(--muted); font-style: italic; min-height: 1.6em; }
  /* Progress */
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--raised); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .tile b { display: block; font-size: 1.5rem; }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 30px; margin-top: 8px; direction: ltr; }
  .bars i { flex: 1; background: var(--gold); border-radius: 2px; min-height: 2px; }
  .bars i.zero { background: var(--line); }
  .words { display: flex; flex-wrap: wrap; gap: 8px; }
  .words button { direction: ltr; }
  .streak { color: var(--gold); font-weight: 600; text-align: center; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 6px; }
  .tabs .pill[aria-selected="true"] { background: var(--ink); color: var(--on-action); }
  .counts { text-align: center; font-weight: 500; }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .grades button { min-height: 58px; border: 1px solid var(--line); border-radius: 12px; background: var(--field); cursor: pointer; line-height: 1.3; }
  .grades button:nth-child(3) { background: var(--ink); color: var(--on-action); }
  .ladder { display: flex; gap: 4px; direction: ltr; margin: 12px 0; }
  .ladder span { flex: 1; text-align: center; padding: 6px 0; border-radius: 8px; background: var(--raised); font-size: .85rem; }
  .ladder .on { background: var(--gold); color: #1a1405; font-weight: 600; }
  .ladder .aim { outline: 2px solid var(--gold); }
  .grades small { display: block; color: inherit; opacity: 0.75; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><img src="icon.png" alt=""><span id="t-brand">مارد · كلام</span></div>
    <button class="pill" id="lang" type="button">English</button>
  </header>

  <!-- Sign in: the 6-digit code from the email -->
  <section id="s-in" hidden>
    <h1 id="t-in-h">اتكلم أي لغة زي مكالمة</h1>
    <p class="muted" id="t-in-p">سجّل بنفس حساب مارد اللي على الكمبيوتر، وتقدّمك يبقى واحد هنا وهناك.</p>
    <button class="primary" type="button" id="google" hidden style="background:var(--field);color:var(--ink);border:1px solid var(--line);margin-bottom:12px">Google</button>
    <form id="email-form" class="stack" novalidate>
      <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@gmail.com" dir="ltr" aria-label="Email">
      <div class="err" id="email-err" role="alert"></div>
      <button class="primary" type="submit" id="t-send">ابعتلي كود</button>
    </form>
    <form id="code-form" class="stack" novalidate hidden>
      <p id="t-code-p">بعتنالك كود من 6 أرقام على الإيميل. اكتبه هنا.</p>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" dir="ltr" aria-label="Code">
      <div class="err" id="code-err" role="alert"></div>
      <button class="primary" type="submit" id="t-verify">ادخل</button>
      <button class="pill" type="button" id="again">إيميل تاني</button>
    </form>
  </section>

  <!-- The talk -->
  <section id="s-talk" hidden>
    <div class="tabs" role="tablist">
      <button class="pill" type="button" role="tab" id="tab-talk" aria-selected="true">كلام</button>
      <button class="pill" type="button" role="tab" id="tab-review" aria-selected="false">مراجعة</button>
    </div>
    <!-- Review: the deck, as Anki (027) -->
    <div id="review" hidden>
      <p class="counts" id="counts"></p>
      <div class="card" id="rv-card">
        <div class="muted" id="rv-deck" style="font-size:.85rem"></div>
        <div id="rv-front" style="font-size:1.7rem;font-weight:600;margin:8px 0"></div>
        <button class="pill" type="button" id="rv-hear" hidden>🔊</button>
        <div id="rv-answer" hidden>
          <hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
          <div id="rv-back" style="font-size:1.25rem;margin-bottom:14px"></div>
          <div class="grades" id="rv-grades"></div>
        </div>
        <button class="primary" type="button" id="rv-show" style="margin-top:14px"></button>
      </div>
      <p class="muted" id="rv-done" hidden style="text-align:center"></p>
    </div>
    <div id="talk">
    <p class="streak" id="streak"></p>
    <label class="muted" for="learn" id="t-learn" style="display:block;font-size:.85rem;margin-bottom:6px"></label>
    <select id="learn"></select>
    <div class="card" id="level" style="margin-bottom:14px"></div>
    <div class="call">
      <button class="orb" id="orb" type="button">ابدأ</button>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <button class="pill" type="button" id="barge" style="font-size:.85rem;min-height:36px"></button>
    </div>
    <div class="chips" id="chips"></div>
    <div class="card" id="turn" hidden aria-live="polite">
      <div class="say" id="say"></div>
      <div class="line" id="line" lang="en"></div>
      <div class="gloss" id="gloss"></div>
      <div class="fix" id="fix"></div>
      <div class="heard" id="heard" lang="en"></div>
    </div>
    <div id="progress"></div>
    </div>
    <p class="muted" id="t-home" style="font-size:.92rem;text-align:center">اعمل الصفحة دي اختصار على الشاشة الرئيسية: من قايمة المتصفح، «إضافة للشاشة الرئيسية».</p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
(() => {
  const SUPABASE_URL = "https://btyuidhqihwxnynivbgz.supabase.co";
  const SUPABASE_KEY = "sb_publishable_RV4AVtTxZp3CZzkKzKXRnA_q13Rxi4E";
  // Implicit, as start.html: a Google sign-in that Supabase sends back to another yamared.com page still signs in here.
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { flowType: "implicit", persistSession: true, detectSessionInUrl: true } });
  const $ = (id) => document.getElementById(id);
  const store = { get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };

  // Language: Arabic (Egyptian, Mared's default) or English, remembered.
  let LANG = store.get("mared-talk-lang", (navigator.language || "ar").startsWith("ar") ? "ar" : "en");
  const T = (ar, en) => (LANG === "ar" ? ar : en);
  function paint() {
    document.documentElement.lang = LANG; document.documentElement.dir = LANG === "ar" ? "rtl" : "ltr";
    document.title = T("مارد · كلام", "Mared · Talk");
    $("lang").textContent = T("English", "عربي");
    $("t-brand").textContent = T("مارد · كلام", "Mared · Talk");
    $("t-in-h").textContent = T("اتكلم أي لغة زي مكالمة", "Speak a language like a phone call");
    $("t-in-p").textContent = T("سجّل بنفس حساب مارد اللي على الكمبيوتر، وتقدّمك يبقى واحد هنا وهناك.", "Sign in with your Mared account, and your progress is the same here and on your computer.");
    $("t-send").textContent = T("ابعتلي كود", "Send me a code");
    $("google").textContent = T("ادخل بـ Google", "Continue with Google");
    $("t-code-p").textContent = T("بعتنالك كود من 6 أرقام على الإيميل. اكتبه هنا.", "We emailed you a 6-digit code. Type it here.");
    $("t-verify").textContent = T("ادخل", "Sign in");
    $("again").textContent = T("إيميل تاني", "Another email");
    $("t-home").textContent = T("اعمل الصفحة دي اختصار على الشاشة الرئيسية: من قايمة المتصفح، «إضافة للشاشة الرئيسية».", "Add this page to your home screen: in the browser's menu, “Add to Home Screen”.");
    if (!live) $("orb").textContent = T("ابدأ", "Start");
    $("tab-talk").textContent = T("كلام", "Talk");
    $("barge").textContent = barge() ? T("✓ تقدر تقاطعني وأنا بتكلم", "✓ You can talk over me") : T("مش هتقدر تقاطعني (مناسب للسبيكر العالي)", "No talking over me (for loud speakers)");
    $("barge").setAttribute("aria-pressed", String(barge()));
    if ($("review").hidden) $("tab-review").textContent = T("مراجعة", "Review"); else if (session) nextCard();
    $("t-learn").textContent = T("بتتعلم إيه؟", "What are you learning?");
    chips(); languages(); paintLevel();
  }
  $("lang").addEventListener("click", () => { LANG = LANG === "ar" ? "en" : "ar"; store.set("mared-talk-lang", LANG); paint(); if (session) progress(); });

  // ---- Sign in ----
  let session = null;
  // Google only when it is switched on (as start.html), back to this page.
  fetch(`${SUPABASE_URL}/auth/v1/settings`, { headers: { apikey: SUPABASE_KEY } })
    .then((r) => r.json()).then((s) => { if (s?.external?.google) $("google").hidden = false; }).catch(() => {});
  $("google").addEventListener("click", () => db.auth.signInWithOAuth({ provider: "google", options: { redirectTo: location.origin + location.pathname } }));
  $("email-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const email = $("email").value.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { $("email").setAttribute("aria-invalid", "true"); $("email-err").textContent = T("اكتب إيميل صحيح.", "Enter a valid email."); return; }
    $("email").removeAttribute("aria-invalid"); $("email-err").textContent = "";
    const { error } = await db.auth.signInWithOtp({ email });
    if (error) { $("email-err").textContent = /rate|seconds/i.test(error.message) ? T("استنى دقيقة وجرّب تاني.", "Wait a minute and try again.") : T("الإيميل ما اتبعتش. جرّب تاني.", "The email didn't send. Try again."); return; }
    $("email-form").hidden = true; $("code-form").hidden = false; $("code").focus();
  });
  async function verify() {
    const token = $("code").value.replace(/\D/g, "");
    if (token.length !== 6) { $("code-err").textContent = T("الكود 6 أرقام.", "The code is 6 digits."); return; }
    const { error } = await db.auth.verifyOtp({ email: $("email").value.trim(), token, type: "email" });
    if (error) $("code-err").textContent = T("الكود مش صح أو خلص. جرّب تاني.", "That code isn't right or has expired.");
  }
  $("code-form").addEventListener("submit", (e) => { e.preventDefault(); verify(); });
  $("code").addEventListener("input", (e) => { e.target.value = e.target.value.replace(/\D/g, "").slice(0, 6); if (e.target.value.length === 6) verify(); });
  $("again").addEventListener("click", () => { $("email-form").hidden = false; $("code-form").hidden = true; });
  db.auth.onAuthStateChange((_, s) => { session = s; $("s-in").hidden = !!s; $("s-talk").hidden = !s; if (s) { progress(); nextCard(); loadLevels(); } });

  async function call(path, body) {
    const { data } = await db.auth.getSession();
    if (!data.session) throw Object.assign(new Error("signed out"), { status: 401 });
    const r = await fetch(SUPABASE_URL + path, { method: "POST", headers: { apikey: SUPABASE_KEY, Authorization: "Bearer " + data.session.access_token, "Content-Type": "application/json" }, body: JSON.stringify(body) });
    if (!r.ok) throw Object.assign(new Error((await r.json().catch(() => ({}))).error || "failed"), { status: r.status });
    return r;
  }

  // ---- The language learned (Hassan, 30 Oct 2026), as the app's Tutor.Core/Targets.cs: the practice function's code,
  // the code for speech and the deck its words go to. Everything is said in one voice. ----
  const TARGETS = [["en", "en", "English", "إنجليزي أمريكي", "American English"],
    ["en-gb", "en", "English", "إنجليزي بريطاني", "British English"],
    ["en-au", "en", "English", "إنجليزي أسترالي", "Australian English"],
    ["es", "es", "Spanish", "إسباني", "Spanish"], ["de", "de", "German", "ألماني", "German"], ["it", "it", "Italian", "إيطالي", "Italian"],
    ["ru", "ru", "Russian", "روسي", "Russian"], ["zh", "zh", "Mandarin", "صيني (ماندرين)", "Mandarin Chinese"], ["he", "he", "Hebrew", "عبري", "Hebrew"]];
  let LEARN = store.get("mared-talk-learn", "en");
  const tg = (code = LEARN) => TARGETS.find((t) => t[0] === code) || TARGETS[0];
  const ofDeck = (deck) => TARGETS.find((t) => t[2] === deck);
  function languages() {
    const box = $("learn"); box.innerHTML = "";
    for (const [code, , , ar, en] of TARGETS) { const o = document.createElement("option"); o.value = code; o.textContent = T(ar, en); o.selected = code === tg()[0]; box.appendChild(o); }
    box.disabled = live;
  }
  $("learn").addEventListener("change", (e) => { LEARN = e.target.value; store.set("mared-talk-learn", LEARN); paintLevel(); });

  // ---- The level, A1 to C2 (029): Mared's judgement of how they speak, and the one they aim for. As Tutor.Core/Targets.cs Cefr. ----
  const CEFR = [["A1", "مبتدئ", "Beginner", "بتعرّف نفسك وتسأل وتجاوب عن حاجات بسيطة.", "You introduce yourself and ask and answer about simple things."],
    ["A2", "أساسي", "Elementary", "بتتكلم عن يومك وشغلك واللي حصل امبارح بجمل بسيطة.", "You talk about your day, your work and what happened yesterday in simple sentences."],
    ["B1", "متوسط", "Intermediate", "بتحكي وتقول رأيك وخططك، وتتصرّف في السفر.", "You tell stories, give your opinion and plans, and get by when travelling."],
    ["B2", "فوق المتوسط", "Upper intermediate", "بتناقش وتدافع عن رأيك بسهولة مع أهل اللغة.", "You discuss and defend your view with ease with native speakers."],
    ["C1", "متقدم", "Advanced", "بتتكلم بطلاقة ودقة في الشغل والدراسة، من غير ما تدوّر على الكلام.", "You speak fluently and precisely at work and in study, without searching for words."],
    ["C2", "متمكّن", "Proficient", "بتفهم وتقول كل حاجة تقريبًا زي أهل اللغة.", "You understand and say almost anything, like a native speaker."]];
  const rank = (l) => CEFR.findIndex((c) => c[0] === l);
  let levels = {};
  async function loadLevels() {
    try { levels = Object.fromEntries((await (await call("/rest/v1/rpc/speaking_levels", {})).json()).map((x) => [x.lang, x])); } catch (e) {}
    paintLevel();
  }
  function paintLevel() {
    const box = $("level"), mine = levels[tg()[0]] || {}, at = rank(mine.level), goal = rank(mine.aim);
    const c = at >= 0 ? CEFR[at] : null;
    box.innerHTML = `<div class="muted" style="font-size:.85rem"></div><div style="font-size:1.6rem;font-weight:600;margin:2px 0"></div><div class="muted" style="font-size:.9rem"></div>` +
      `<div class="ladder">${CEFR.map((x, i) => `<span class="${i <= at ? "on" : ""} ${i === goal ? "aim" : ""}">${i === goal ? "🎯 " : ""}${x[0]}</span>`).join("")}</div><select aria-label=""></select><div class="muted" style="font-size:.85rem"></div>`;
    const [head, big, can, , pick, left] = box.children;
    head.textContent = T("مستواك", "Your level");
    big.textContent = c ? `${c[0]} · ${T(c[1], c[2])}` : T("لسه هنعرفه", "Not known yet");
    big.style.color = c ? "var(--gold)" : "";
    can.textContent = c ? T(c[3], c[4]) : T("اتكلم معايا شوية وأنا هقيس مستواك بالمقياس العالمي، من A1 لـ C2.", "Talk with me a little and I'll measure your level on the international scale, from A1 to C2.");
    pick.setAttribute("aria-label", T("هدفك", "Your goal")); pick.style.marginBottom = "6px";
    for (const [v, ar, en] of [["", "اختار هدفك", "Pick your goal"], ...CEFR.map((x) => [x[0], `${x[0]} · ${x[1]}`, `${x[0]} · ${x[2]}`])]) {
      const o = document.createElement("option"); o.value = v; o.textContent = T(ar, en); o.selected = v === (mine.aim || ""); pick.appendChild(o);
    }
    pick.addEventListener("change", async () => {
      if (!pick.value) return;
      try { await call("/rest/v1/rpc/set_level_aim", { p_lang: tg()[0], p_aim: pick.value }); } catch (e) {}
      loadLevels();
    });
    left.textContent = goal < 0 ? T("اختار المستوى اللي عايز توصله، وأنا هوجّه الكلام ليه.", "Pick the level you want to reach, and I'll steer our talks toward it.")
      : at >= goal ? T("وصلت لهدفك! 🎉 اختار هدف أعلى.", "You reached your goal! 🎉 Pick a higher one.")
      : at < 0 ? T(`هدفك ${mine.aim}: هعرف مستواك من أول كلام بينا.`, `Your goal is ${mine.aim}: I'll find your level from our first talk.`)
      : T(`فاضلك ${goal - at} مستوى وتوصل ${mine.aim}.`, `${goal - at} level(s) to go to reach ${mine.aim}.`);
  }

  // ---- Topics ----
  const TOPICS = [["", "اختارلي", "Surprise me"], ["science", "علوم", "Science"], ["technology", "تكنولوجيا", "Technology"], ["films and series", "أفلام ومسلسلات", "Films and series"],
    ["football", "كورة", "Football"], ["history", "تاريخ", "History"], ["travel", "سفر", "Travel"], ["a job interview role-play: you are the interviewer", "مقابلة شغل", "Job interview"],
    ["everyday slang and idioms people really use", "كلام الشارع", "Everyday slang"]];
  let topic = "";
  function chips() {
    const box = $("chips"); box.innerHTML = "";
    $("learn").disabled = live; // a call keeps its language
    if (live) return;
    for (const [value, ar, en] of TOPICS) {
      const b = document.createElement("button"); b.type = "button"; b.className = "pill"; b.textContent = T(ar, en);
      b.setAttribute("aria-pressed", String(topic === value));
      b.addEventListener("click", () => { topic = value; chips(); });
      box.appendChild(b);
    }
  }

  // ---- The call ----
  const SR = 16000, TURN_MAX = 30 * SR, STUCK_MS = 60000;
  let live = false, ctx = null, stream = null, ws = null, wsLang = undefined, playing = false, quietUntil = 0, busy = false, wake = null;
  let turnPcm = [], turnLen = 0, history = "", line = "", expect = "none", stucks = 0, lastHeardAt = 0, stuckTimer = null, proc = null;
  const dialect = () => (LANG === "ar" ? "eg" : "en");
  const notes = () => store.get("mared-talk-notes", []);

  function status(t) { $("status").textContent = t; }
  function orb(state) { const o = $("orb"); o.className = "orb" + (live ? " live" : "") + (state === "speaking" ? " speaking" : ""); o.textContent = live ? T("إنهاء", "End") : T("ابدأ", "Start"); }

  $("orb").addEventListener("click", () => (live ? end(T("خلصنا. برافو عليك!", "Done. Well done!")) : start()));

  async function start() {
    sound(); // made from the tap itself: iPhones only allow sound that a tap started
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
    } catch (e) { status(T("محتاج إذن الميكروفون عشان نتكلم.", "I need the microphone to talk.")); return; }
    live = true; history = ""; line = ""; expect = "none"; stucks = 0; chips(); orb();
    try { wake = await navigator.wakeLock?.request("screen"); } catch (e) {} // the screen stays on, so the mic does
    const src = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(4096, 1, 1);
    proc.onaudioprocess = (e) => {
      if (!live) return;
      const pcm = down(e.inputBuffer.getChannelData(0), ctx.sampleRate);
      const quiet = busy || (!barge() && (playing || performance.now() < quietUntil));
      if (!quiet) { turnPcm.push(pcm); turnLen += pcm.length; while (turnLen - turnPcm[0].length > TURN_MAX) turnLen -= turnPcm.shift().length; }
      send(quiet ? new Int16Array(pcm.length) : pcm); // silence while Mared talks: it never hears itself
    };
    src.connect(proc); proc.connect(ctx.destination);
    await turn("start", "", null);
  }

  function end(say) {
    if (!live) return;
    live = false; busy = false; clearInterval(stuckTimer); clearTimeout(holdTimer); held = "";
    try { ws?.close(); } catch (e) {} ws = null; wsLang = undefined;
    stream?.getTracks().forEach((t) => t.stop()); stream = null;
    try { proc?.disconnect(); } catch (e) {} proc = null;
    try { wake?.release(); } catch (e) {}
    try { playingNow?.stop(); } catch (e) {} playing = false;
    orb(); chips(); status(say || ""); progress();
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden && live) end(T("وقفنا لما قفلت الشاشة. دوس «ابدأ» نكمّل.", "Paused when the screen closed. Tap Start to carry on.")); });

  // 48 or 44.1 kHz floats to 16 kHz 16-bit: each output sample the average of the input it covers.
  function down(f, rate) {
    const ratio = rate / SR, n = Math.floor(f.length / ratio), out = new Int16Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0, a = Math.floor(i * ratio), b = Math.min(f.length, Math.floor((i + 1) * ratio));
      for (let j = a; j < b; j++) s += f[j];
      const v = Math.max(-1, Math.min(1, s / Math.max(1, b - a)));

  }
  function wav() {
    if (turnLen < SR / 2) return null; // under half a second: nothing to score
    const bytes = new Uint8Array(44 + turnLen * 2), v = new DataView(bytes.buffer);
    const text = (at, s) => { for (let i = 0; i < 4; i++) bytes[at + i] = s.charCodeAt(i); };
    text(0, "RIFF"); v.setUint32(4, 36 + turnLen * 2, true); text(8, "WAVE"); text(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); text(36, "data"); v.setUint32(40, turnLen * 2, true);

  }

  // The live transcriber in the language the next answer comes in; it ends each turn after 2 s of silence.
  async function listen(lang) {
    if (ws && ws.readyState <= 1 && wsLang === lang) return;
    try { ws?.close(); } catch (e) {}
    const { token } = await (await call("/functions/v1/voice", { mode: "stt_token" })).json();
    const q = new URLSearchParams({ model_id: "scribe_v2_realtime", audio_format: "pcm_16000", commit_strategy: "vad", vad_silence_threshold_secs: "2.0", token });
    if (lang) q.set("language_code", lang);
    ws = new WebSocket("wss://api.elevenlabs.io/v1/speech-to-text/realtime?" + q);
    wsLang = lang;
    ws.onmessage = (m) => {
      let msg; try { msg = JSON.parse(m.data); } catch (e) { return; }
      const text = (msg.text || "").trim();
      if (msg.message_type === "partial_transcript" && text && !busy) {
        if (playing && barge() && !echo(text)) { cutNow = true; try { playingNow?.stop(); } catch (e) {} }
        if (!playing || cutNow) { $("heard").textContent = text; lastHeardAt = Date.now(); }
      }
      else if (msg.message_type === "committed_transcript" && text.replace(/[^\p{L}]/gu, "").length >= 2 && !busy && (!playing || cutNow)) hold(text);
    };
  }

  // A turn that stopped mid-sentence ("because…", «عشان…»): they are thinking, so it waits 3 s more, longer while they
  // talk on. As Speaking.Unfinished in the app.
  const LEADS = new Set(("and but because cause cuz so or the a an to of with that which who when if um uh er erm like my your is was are were in on at " +
    "for than then about from into just really very maybe actually think mean y pero porque que de el la los las un una en con para por o mi muy pues este " +
    "und aber weil dass der die das ein eine mit zu von für oder ich sehr also äh ähm e ma perché perche che di il lo uno per mio molto quindi allora " +
    "и но потому что в на с или а это очень ну чтобы אבל כי או עם של את גם אז אם כאילו و بس عشان لان لأن اللي يعني في من مع او أو ان إن انا أنا").split(" "));
  const ZH_LEADS = ["因为", "但是", "可是", "所以", "然后", "如果", "和", "的", "就是", "那个"];
  function unfinished(t) {
    t = t.trim();
    if (!t) return false;
    if (/[,\-—،…]$/.test(t) || t.endsWith("...")) return true;
    if (ZH_LEADS.some((z) => t.replace(/[。，.,]+$/, "").endsWith(z))) return true;
    const last = (t.split(/\s+/).pop() || "").replace(/[^\p{L}]/gu, "").toLowerCase();
    return LEADS.has(last);
  }
  let held = "", holdTimer = null;
  function hold(text) {
    held = held ? held + " " + text : text;
    clearTimeout(holdTimer);
    if (!unfinished(held)) { const all = held; held = ""; return answer(all); }
    $("heard").textContent = held + " …";
    holdTimer = setTimeout(function wait() {
      if (Date.now() - lastHeardAt < 1000) { holdTimer = setTimeout(wait, 500); return; } // still talking
      const all = held; held = "";
      if (all && live && !busy) answer(all);
    }, 3000);
  }

  const STOP = /^(stop|end|bye|خلاص|كفايه|كفاية|وقف|وقّف|بطل|بطّل)([\s.!]|$)/i;
  function answer(text) {
    try { playingNow?.stop(); } catch (e) {} // they talked over Mared: it stops
    if (STOP.test(text.trim()) && text.trim().split(/\s+/).length <= 3) return end(T("تمام، وقفنا.", "OK, we stopped."));
    $("heard").textContent = text;
    turn("answer", text, wav());
  }

  // Talking over Mared (a phone's echo cancellation keeps its own voice out): on unless turned off. A partial transcript
  // that is mostly Mared's own words is its echo, not the learner.
  const barge = () => store.get("mared-talk-barge", true);
  let spokenNow = "", cutNow = false, gen = 0;
  function echo(text) {
    const words = text.toLowerCase().match(/\p{L}+/gu) || [];
    if (words.length < 3) return true; // too little to cut Mared off for
    const said = new Set(spokenNow.toLowerCase().match(/\p{L}+/gu) || []);
    return words.filter((w) => said.has(w)).length >= words.length * 0.6;
  }

  async function turn(ev, heard, audio) {
    const my = ++gen;
    busy = true; status(T("بفكّر…", "Thinking…"));
    try {
      const t = await (await call("/functions/v1/practice", {
        mode: "talk", topic, course: "", lesson: "Talk", goal: "free conversation", notes: notes().join("\n").slice(-4000), learner: "",
        event: ev, heard, line, expect, history: history.slice(-4000), review: "", audio, dialect: dialect(), learn: tg()[0],
        day: new Date().toLocaleDateString("en-CA"), level: (levels[tg()[0]] || {}).level || "", aim: (levels[tg()[0]] || {}).aim || "",
      })).json();
      if (!live || my !== gen) return;
      if (ev === "answer") history += "Learner: " + heard + "\n";
      history += "Mared: " + t.say + (t.line ? " [line: " + t.line + "]" : "") + "\n";
      if (t.note) store.set("mared-talk-notes", [...notes(), t.note].slice(-40));
      if (t.topic) topic = t.topic;
      $("turn").hidden = false;
      $("say").textContent = t.say; $("line").textContent = t.line || ""; $("gloss").textContent = t.gloss || "";
      let up = "";
      if (t.level) { // Mared judged a new level: kept by the server already
        const before = rank((levels[tg()[0]] || {}).level);
        levels[tg()[0]] = { ...(levels[tg()[0]] || {}), level: t.level }; paintLevel();
        if (rank(t.level) > before) up = before < 0 ? T(`مستواك: ${t.level}`, `Your level: ${t.level}`) : T(`🎉 مستواك بقى ${t.level}!`, `🎉 You're now ${t.level}!`);
      }
      $("fix").textContent = [up, t.fix ? "✓ " + t.fix : "", t.better ? T("أحلى: ", "Better: ") + t.better : ""].filter(Boolean).join(" · ");
      $("heard").textContent = "";
      line = t.line || ""; expect = t.expect || "reply";
      stucks = ev === "stuck" ? stucks : 0;
      orb("speaking"); status("");
      busy = false; // from here they may talk over Mared
      spokenNow = t.say + " " + (t.line || ""); cutNow = false;
      const first = voice(t.say, dialect() === "en" ? "en" : "ar"), second = t.line ? voice(t.line, tg()[1]) : null; // the second is made while the first plays
      await play(first);
      if (live && !cutNow && my === gen) await play(second);
      if (!live || my !== gen) return;
      if (cutNow) { orb(); status(T("سامعك…", "Listening…")); return; } // already talking: the same connection hears the rest
      turnPcm = []; turnLen = 0; quietUntil = performance.now() + 300;
      await listen(expect === "repeat" || expect === "answer" ? tg()[1] : (dialect() === "en" ? "en" : null));
      orb(); status(T("سامعك…", "Listening…"));
      lastHeardAt = Date.now();
      clearInterval(stuckTimer);
      stuckTimer = setInterval(() => {
        if (!live || busy || playing || Date.now() - lastHeardAt < STUCK_MS) return;
        clearInterval(stuckTimer);
        if (++stucks >= 3) end(T("هقفل المايك دلوقتي. دوس «ابدأ» لما تحب نكمّل.", "I'll close the mic now. Tap Start when you want to carry on."));
        else turn("stuck", "", null);

    } catch (e) {
      if (e.status === 402) end(T("اللي متاحلك خلص. اشترك من yamared.com/start ونكمّل.", "You've used what you had. Subscribe at yamared.com/start and we'll carry on."));
      else if (e.status === 401) { end(); await db.auth.signOut(); }
      else end(T("حصلت مشكلة في النت. دوس «ابدأ» نجرّب تاني.", "Something went wrong with the connection. Tap Start to try again."));
      return;

  }

  // One audio engine for the mic and Mared's voice, made (or woken) from a tap.
  function sound() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  let playingNow = null;
  const voice = (text, language, v) => (text ? call("/functions/v1/voice", { mode: "tts", text, language, ...(v ? { voice: v } : {}) }).then((r) => r.arrayBuffer()).catch(() => null) : null);
  const speak = (text, language, v) => play(voice(text, language, v));
  async function play(pending) {
    if (!pending) return;
    try {
      const mp3 = await pending;
      if (!mp3 || !ctx) return;
      const clip = await ctx.decodeAudioData(mp3);
      const src = ctx.createBufferSource();
      src.buffer = clip; src.connect(ctx.destination);
      playing = true; playingNow = src;
      await new Promise((done) => { src.onended = done; src.start(); });
    } catch (e) { /* no voice: the words are on the card */ }
    finally { playing = false; playingNow = null; quietUntil = performance.now() + 300; }
  }

  // ---- Progress: the server's, the same as the Windows app's ----
  async function progress() {
    const { data: p } = await db.rpc("speaking_stats", { p_days: 30 });
    const box = $("progress"); box.innerHTML = "";
    if (!p) return;
    const day = (d) => d.toLocaleDateString("en-CA");
    const today = new Date(), active = new Set(p.active_days || []);
    let streak = 0, d = new Date(today);
    if (!active.has(day(d))) d.setDate(d.getDate() - 1); // a streak that ended yesterday is still alive today
    while (active.has(day(d))) { streak++; d.setDate(d.getDate() - 1); }
    $("streak").textContent = streak > 0 ? T(`🔥 ${streak} يوم ورا بعض`, `🔥 ${streak} days in a row`) : T("ابدأ سلسلتك النهارده: دقيقتين بس.", "Start your streak today: just two minutes.");
    if (!p.talks && !p.words_total) return;
    const days = [...Array(14)].map((_, i) => { const x = new Date(today); x.setDate(x.getDate() - 13 + i); return day(x); });
    const by = Object.fromEntries((p.days || []).map((x) => [x.day, x]));
    const per = (f) => days.map((x) => (by[x] ? f(by[x]) : 0));
    const learned = days.map((x) => (p.words || []).filter((w) => w.day === x).length);
    const tile = (n, name, values) => {
      const max = Math.max(1, ...values);
      return `<div class="tile"><b>${n}</b><span class="muted">${name}</span><div class="bars" aria-hidden="true">${values.map((v) => `<i class="${v ? "" : "zero"}" style="height:${Math.max(2, (v / max) * 30)}px"></i>`).join("")}</div></div>`;
    };
    box.innerHTML = `<h2 style="font-size:1.15rem">${T("تقدّمك", "Your progress")}</h2><div class="tiles">` +
      tile(p.words_total, T("كلمة اتعلمتها", "words learned"), learned) + tile(p.words_spoken, T("كلمة قلتها", "words spoken"), per((x) => x.words_spoken)) +
      tile(p.talks, T("محادثة", "talks"), per((x) => x.talks)) + tile(Math.floor(p.seconds / 60), T("دقيقة بصوتك", "minutes of your voice"), per((x) => x.seconds / 60)) + `</div>`;
    // This week: the last 7 days, as the Windows app's weekly message.
    const week = days.slice(-7), sum = (f) => week.reduce((a, x) => a + (by[x] ? f(by[x]) : 0), 0);
    const newWords = (p.words || []).filter((w) => week.includes(w.day)).length;
    if (sum((x) => x.words_spoken) > 0) box.insertAdjacentHTML("beforeend", `<p class="muted" style="text-align:center">${T(
      `الأسبوع ده: قلت ${sum((x) => x.words_spoken)} كلمة في ${sum((x) => x.talks)} محادثة، واتعلمت ${newWords} كلمة جديدة.`,
      `This week: ${sum((x) => x.words_spoken)} words in ${sum((x) => x.talks)} talks, and ${newWords} new words.`)}</p>`);
    if ((p.words || []).length) {
      const h = document.createElement("h2"); h.style.fontSize = "1.15rem"; h.textContent = T("كلماتك: دوس تسمعها", "Your words: tap to hear");
      const list = document.createElement("div"); list.className = "words";
      for (const w of p.words.slice(0, 40)) {
        const b = document.createElement("button"); b.type = "button"; b.className = "pill"; b.textContent = w.gloss ? `${w.en} · ${w.gloss}` : w.en;
        b.addEventListener("click", () => { if (!live) { sound(); speak(w.en, tg()[1]); } });
        list.appendChild(b);
      }
      box.append(h, list);
    }
  }

  // ---- Review: the deck, scheduled as Anki does on the server (027); the same cards as the Windows app ----
  const wait = (s) => {
    const n = (x, d = 0) => Math.round(x * 10 ** d) / 10 ** d;
    if (s < 3600) return T(`${Math.max(1, n(s / 60))} دقيقة`, `${Math.max(1, n(s / 60))}m`);
    if (s < 86400) return T(`${n(s / 3600)} ساعة`, `${n(s / 3600)}h`);
    if (s < 30 * 86400) return T(`${n(s / 86400)} يوم`, `${n(s / 86400)}d`);
    if (s < 365 * 86400) return T(`${n(s / 2592000, 1)} شهر`, `${n(s / 2592000, 1)}mo`);
    return T(`${n(s / 31536000, 1)} سنة`, `${n(s / 31536000, 1)}y`);
  };
  const latin = (t) => (t.match(/[A-Za-z]/g) || []).length * 2 > (t.match(/\p{L}/gu) || []).length;
  let card = null, grading = false;
  function tab(name) {
    $("tab-talk").setAttribute("aria-selected", String(name === "talk")); $("tab-review").setAttribute("aria-selected", String(name === "review"));
    $("talk").hidden = name !== "talk"; $("review").hidden = name !== "review";
    if (name === "review") { if (live) end(); nextCard(); }
  }
  $("tab-talk").addEventListener("click", () => tab("talk"));
  $("tab-review").addEventListener("click", () => tab("review"));
  async function nextCard() {
    let due = null;
    try { due = await (await call("/rest/v1/rpc/due_cards", { p_day: new Date().toLocaleDateString("en-CA"), p_limit: 20 })).json(); } catch (e) {}
    grading = false;
    $("tab-review").textContent = T("مراجعة", "Review") + (due && due.new + due.learning + due.review ? ` (${due.new + due.learning + due.review})` : "");
    card = due?.cards?.[0] || null;
    $("rv-card").hidden = !card; $("rv-done").hidden = !!card;
    if (!due) { $("rv-done").textContent = T("مقدرتش أجيب الكروت. اتأكد من النت.", "Couldn't load your cards. Check the connection."); $("counts").textContent = ""; return; }
    $("counts").innerHTML = `<span style="color:var(--gold)">${due.new} ${T("جديد", "new")}</span> · ${due.learning} ${T("بتتعلمه", "learning")} · <span class="muted">${due.review} ${T("مراجعة", "to review")}</span>`;
    if (!card) {
      $("rv-done").textContent = due.total ? T(`خلّصت مراجعة النهارده 🎉 راجعت ${due.reviewed_today} كارت.`, `Done for today 🎉 You reviewed ${due.reviewed_today} cards.`)
        : T("لسه مفيش كروت. الكلمات اللي بتتعلمها في الكلام بتبقى كروت هنا لوحدها.", "No cards yet. Words you learn while talking become cards here by themselves.");
      return;
    }
    $("rv-deck").textContent = card.deck;
    $("rv-front").textContent = card.front; $("rv-front").dir = latin(card.front) ? "ltr" : "auto";
    $("rv-back").textContent = card.back; $("rv-back").dir = latin(card.back) ? "ltr" : "auto";
    $("rv-hear").hidden = !(ofDeck(card.deck) && card.kind === "word");
    $("rv-answer").hidden = true; $("rv-show").hidden = false; $("rv-show").textContent = T("وريني الإجابة", "Show answer");
    const names = [T("تاني", "Again"), T("صعب", "Hard"), T("تمام", "Good"), T("سهل", "Easy")];
    $("rv-grades").innerHTML = "";
    names.forEach((name, i) => {
      const b = document.createElement("button"); b.type = "button";
      b.innerHTML = `${name}<small>${wait(card.next[i] || 0)}</small>`;
      b.addEventListener("click", () => grade(i + 1));
      $("rv-grades").appendChild(b);
    });
  }
  async function grade(g) {
    if (!card || grading) return;
    grading = true;
    try { await call("/rest/v1/rpc/review_card", { p_id: card.id, p_grade: g, p_day: new Date().toLocaleDateString("en-CA") }); } catch (e) {}
    nextCard();
  }
  $("barge").addEventListener("click", () => { store.set("mared-talk-barge", !barge()); paint(); });
  $("rv-show").addEventListener("click", () => { $("rv-answer").hidden = false; $("rv-show").hidden = true; });
  $("rv-hear").addEventListener("click", () => { sound(); speak(card.front, (ofDeck(card.deck) || tg())[1]); });
  document.addEventListener("keydown", (e) => {
    if ($("review").hidden || !card || e.target.tagName === "INPUT") return;
    if ($("rv-answer").hidden) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); $("rv-show").click(); } return; }
    const g = { "1": 1, "2": 2, "3": 3, "4": 4, " ": 3, Enter: 3 }[e.key];
    if (g) { e.preventDefault(); grade(g); }
  });

  paint();
  db.auth.getSession().then(({ data }) => { session = data.session; $("s-in").hidden = !!session; $("s-talk").hidden = !session; if (session) { progress(); nextCard(); } });
})();
</script>
</body>
