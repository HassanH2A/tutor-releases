<!doctype html>
<html lang="ar" dir="rtl" data-look="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مارد · كلام</title>
<meta name="description" content="اتكلم أي لغة مع مارد زي مكالمة: يصحّحلك، ويقيس نطقك، ويعرف مستواك من A1 لـ C2.">
<meta name="theme-color" content="#0a0f1e" id="theme-color">
<link rel="manifest" href="talk.webmanifest">
<link rel="icon" href="talk-icon-192.png">
<link rel="apple-touch-icon" href="talk-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mared">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Playball&family=Readex+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<!--
  Mared's language talk on a phone (Hassan, 29 Oct 2026: "when people use the shortcut on their phones, they could just
  open it up, speak to it, have the conversation like a phone call"). The same free talk as the Windows app: the mic
  stays open, ElevenLabs' live transcriber ends each turn on a pause, the practice function answers and scores the
  voice, the voice function speaks. Progress, levels and cards are the server's, the same on both.
  Laid out as a phone app in the brand's Lamp Navy (Hassan, 30 Oct 2026: "why is it not using the brand guideline...
  it looks generic"): navy, ivory and gold, flat; Readex Pro, with Aref Ruqaa / Playball for the logo and headlines;
  gold is Mared's alone (its mark, its name, the listening dot, the voice bars), everything else is ink. Mared is the
  hero: its mark starts the talk, and in the call it shows the brand's moods (listening, thinking, speaking).
-->
<style>
  :root, [data-look="dark"] {
    --bg: #0a0f1e; --surface: #0e1426; --panel: #151c31; --raised: #1e273f; --line: #2a3450;
    --ink: #f3ead8; --muted: #a4acbd; --gold: #d9a440; --bad: #ff8a80;
    color-scheme: dark;
  }
  [data-look="light"] {
    --bg: #f7f3ea; --surface: #f7f3ea; --panel: #ffffff; --raised: #efe9dc; --line: #e2dacb;
    --ink: #0a0f1e; --muted: #566074; --gold: #9a6a17; --bad: #b3261e;
    color-scheme: light;
  }
  /* The call is always Lamp Navy at night, in either look */
  .call { --bg: #0a0f1e; --panel: #151c31; --raised: #1e273f; --line: #2a3450; --ink: #f3ead8; --muted: #a4acbd; --gold: #d9a440; }
  :root { --font: "Readex Pro", system-ui, sans-serif; --display: "Aref Ruqaa", serif; }
  :root[lang="en"] { --display: Playball, cursive; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
  body { min-height: 100dvh; -webkit-tap-highlight-color: transparent; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }
  .muted { color: var(--muted); }
  a, .link { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; border-radius: 6px; }
  ::selection { background: var(--ink); color: var(--bg); }

  /* Mared's mark and name: gold, the only gold on the page */
  .mark { color: var(--gold); display: block; }
  .name { color: var(--gold); font: 700 1.3em/1 var(--display); }
  :root[lang="en"] .name { font-weight: 400; }
  .lockup { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--gold); }
  .lockup .mark { width: 54px; height: 60px; }
  .lockup .en { font: 400 40px/1 Playball, cursive; }
  .lockup .ar { font: 700 40px/1.3 "Aref Ruqaa", serif; }

  /* Screens */
  .screen { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 96px); }
  .top { display: flex; align-items: center; justify-content: space-between; min-height: 44px; margin-bottom: 6px; }
  .top .brand { display: flex; align-items: center; gap: 8px; }
  .top .brand .mark { width: 24px; height: 27px; }
  .top .brand .name { font-size: 24px; }
  .hero { font: 700 40px/1.35 var(--display); margin: 10px 0 2px; color: var(--ink); }
  :root[lang="en"] .hero { font-weight: 400; font-size: 46px; line-height: 1.2; }
  .title { font-size: 22px; font-weight: 600; line-height: 30px; margin: 8px 0 16px; }
  .label { font-size: 13px; font-weight: 500; color: var(--muted); margin: 26px 4px 8px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .row { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 16px; }
  .row + .row { border-top: 1px solid var(--line); }
  .row > .grow { flex: 1; min-width: 0; }
  .row small { display: block; color: var(--muted); font-size: 12px; line-height: 16px; }
  .row select { appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: var(--ink); font-weight: 500; text-align: end; padding: 8px 0; max-width: 62%; }
  .row .chev { color: var(--muted); }
  .rowbtn { border: 0; background: none; padding: 0; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }

  /* A toggle: line when off, ink when on */
  .switch { appearance: none; -webkit-appearance: none; width: 46px; height: 28px; border-radius: 14px; background: var(--line); position: relative; flex: none; margin: 0; transition: background 0.2s; }
  .switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); transition: transform 0.2s; }
  .switch:checked { background: var(--ink); }
  .switch:checked::after { transform: translateX(18px); }
  [dir="rtl"] .switch:checked::after { transform: translateX(-18px); }

  /* Buttons: ink, as the brand's */
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 50px; border: 0; border-radius: 999px; background: var(--ink); color: var(--bg); font-weight: 600; font-size: 16px; }
  .btn.ghost { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
  .btn:disabled { opacity: 0.5; }
  .chip { flex: none; min-height: 38px; padding: 0 16px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--ink); white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  input[type="email"], input[inputmode="numeric"] { width: 100%; min-height: 50px; padding: 0 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  input[aria-invalid] { border-color: var(--bad); }
  .err { color: var(--bad); font-size: 13px; min-height: 1.4em; margin: 6px 2px; }
  .stack > * + * { margin-top: 10px; }

  /* Sign in: the lockup, as the first-launch screen */
  .welcome { text-align: center; padding-top: 9vh; margin-bottom: 28px; }
  .welcome .hero { font-size: 34px; margin-top: 30px; }
  :root[lang="en"] .welcome .hero { font-size: 40px; }
  .welcome p { margin: 8px 12px 0; }

  /* Talk */
  .streak { font-size: 13px; font-weight: 500; padding: 4px 12px; border-radius: 999px; background: var(--raised); }
  .topics { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 4px; scrollbar-width: none; }
  .topics::-webkit-scrollbar { display: none; }
  .genie { display: grid; place-items: center; gap: 6px; margin: 30px 0 4px; }
  .genie button { border: 0; background: none; padding: 10px; border-radius: 50%; }
  .genie .mark { width: 128px; height: 142px; transition: transform 0.2s; animation: float 4s ease-in-out infinite; }
  .genie button:active .mark { transform: scale(0.95); }
  .genie .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
  @keyframes float { 50% { translate: 0 -6px; } }
  .start-btn { max-width: 260px; margin: 18px auto 0; }
  .hint { text-align: center; font-size: 13px; margin: 10px 24px 0; }

  /* The call, laid out as a phone's call screen (Hassan, 30 Oct 2026: "still not a proper call ui"): the name and the
     time at the top, the person large in the middle (rings while they speak), live captions as subtitles near the
     bottom, and one row of round call keys ending in the red hang-up. Red is the one colour outside the brand: it is
     what every phone's hang-up is. */
  .call { position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column; align-items: center; background: #0a0f1e; color: #f3ead8;
    padding: calc(env(safe-area-inset-top) + 28px) 18px calc(env(safe-area-inset-bottom) + 18px); }
  .caller { text-align: center; }
  .caller-name { font-size: 32px; font-weight: 600; line-height: 1.2; margin: 0; }
  .caller-sub { font-size: 16px; color: #a4acbd; font-variant-numeric: tabular-nums; min-height: 1.5em; margin-top: 4px; }
  .portrait { flex: 1; display: grid; place-items: center; align-content: center; gap: 18px; min-height: 0; }
  .face { position: relative; width: 172px; height: 172px; border-radius: 50%; display: grid; place-items: center; background: #1e273f; }
  .face .mark { width: 104px; height: 116px; }
  .face .avatar.big { width: 100%; height: 100%; font-size: 68px; background: none; }
  .face::before, .face::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 2px solid rgba(243, 234, 216, 0.35); opacity: 0; }
  .call[data-who="mared"] .face::before, .call[data-who="mared"] .face::after { border-color: rgba(217, 164, 64, 0.55); }
  .call[data-state="speaking"] .face::before, .call[data-state="speaking"] .face::after { animation: ring 1.6s ease-out infinite; }
  .call[data-state="speaking"] .face::after { animation-delay: 0.8s; }
  .call[data-state="listening"] .face { box-shadow: 0 0 0 calc(var(--lvl, 0) * 14px) rgba(243, 234, 216, 0.12); transition: box-shadow 0.08s linear; }
  @keyframes ring { from { transform: scale(1); opacity: 0.9; } to { transform: scale(1.32); opacity: 0; } }
  .mood { height: 24px; display: flex; align-items: center; justify-content: center; }
  .mood > * { display: none; }
  .call[data-state="listening"] .listen, .call[data-state="thinking"] .think { display: flex; align-items: center; gap: 5px; }
  .call[data-muted="true"] .listen { display: none; }
  .listen { font-size: 13px; color: #a4acbd; }
  .listen i { width: 8px; height: 8px; border-radius: 50%; background: #d9a440; }
  .call[data-who="char"] .listen i { background: #f3ead8; }
  .think i { width: 7px; height: 7px; border-radius: 50%; background: #a4acbd; animation: hop 1s ease-in-out infinite; }
  .think i:nth-child(2) { animation-delay: 0.15s; } .think i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes hop { 50% { transform: translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .genie .mark, .think i, .face::before, .face::after { animation: none !important; } }
  .status { text-align: center; font-size: 13px; color: #a4acbd; min-height: 1.2em; }
  /* Live captions: what is being said now, as subtitles */
  .captions { width: 100%; max-width: 520px; max-height: 34vh; overflow-y: auto; text-align: center; margin-bottom: 18px; }
  .call[data-captions="false"] .captions { visibility: hidden; }
  .cap { font-size: 18px; line-height: 1.45; }
  .cap .name { display: block; font: 500 12px var(--font); color: #a4acbd; margin-bottom: 2px; }
  .say { display: inline; }
  .line { direction: ltr; font-size: 22px; font-weight: 600; line-height: 1.3; margin-top: 10px; }
  .gloss { color: #a4acbd; font-size: 14px; margin-top: 4px; }
  .fix { display: inline-block; margin-bottom: 10px; padding: 4px 12px; border-radius: 999px; background: #1e273f; font-size: 13px; font-weight: 500; }
  .fix:empty { display: none; }
  .heard { color: #a4acbd; font-style: italic; margin-top: 10px; font-size: 15px; }
  /* The call keys, in one row, as a phone's */
  .controls { display: flex; justify-content: center; align-items: flex-start; gap: 22px; width: 100%; max-width: 420px; }
  .key { display: flex; flex-direction: column; align-items: center; gap: 7px; border: 0; background: none; color: #f3ead8; font-size: 12px; width: 66px; padding: 0; }
  .key > span:first-child { width: 62px; height: 62px; border-radius: 50%; background: rgba(243, 234, 216, 0.14); display: grid; place-items: center; transition: background 0.15s; }
  .key svg { width: 26px; height: 26px; }
  .key[aria-pressed="true"] > span:first-child { background: #f3ead8; color: #0a0f1e; }
  .key.end > span:first-child { background: #e5484d; color: #fff; }
  #mute .slash { display: none; } #mute[aria-pressed="true"] .slash { display: inline; }

  /* Review */
  .counts { display: flex; gap: 8px; margin-bottom: 14px; }
  .counts span { flex: 1; text-align: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px 0; font-size: 12px; color: var(--muted); }
  .counts b { display: block; font-size: 22px; font-weight: 600; color: var(--ink); line-height: 1.3; }
  .flash { min-height: 300px; padding: 20px; display: flex; flex-direction: column; }
  .flash .deck { font-size: 12px; color: var(--muted); }
  .flash .front { font-size: 30px; font-weight: 600; margin: 34px 0 8px; text-align: center; line-height: 1.3; }
  .flash .back { font-size: 20px; text-align: center; margin: 4px 0 18px; }
  .flash hr { border: 0; border-top: 1px solid var(--line); margin: 16px 0; width: 100%; }
  .flash .hear { align-self: center; border: 0; background: none; color: var(--ink); padding: 8px; border-radius: 999px; }
  .flash .hear svg { width: 26px; height: 26px; display: block; }
  .flash .spacer { flex: 1; }
  .grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .grades button { min-height: 60px; border: 1.5px solid var(--line); border-radius: 12px; background: none; color: var(--ink); font-weight: 600; line-height: 1.25; }
  .grades button:nth-child(3) { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .grades small { display: block; font-weight: 400; font-size: 12px; opacity: 0.8; }
  .done { text-align: center; padding: 40px 20px; }

  /* Progress */
  .level { padding: 18px; }
  .level .big { font-size: 30px; font-weight: 600; line-height: 1.3; }
  .ladder { display: flex; gap: 4px; direction: ltr; margin: 14px 0; }
  .ladder span { flex: 1; text-align: center; padding: 7px 0; border-radius: 6px; background: var(--raised); font-size: 13px; font-weight: 600; color: var(--muted); }
  .ladder .on { background: var(--ink); color: var(--bg); }
  .ladder .aim { box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); }
  .level select { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 0 12px; margin: 4px 0 6px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
  .tile b { display: block; font-size: 26px; font-weight: 600; line-height: 1.3; }
  .tile span { font-size: 12px; color: var(--muted); }
  .bars { display: flex; align-items: flex-end; gap: 2px; height: 28px; margin-top: 10px; direction: ltr; }
  .bars i { flex: 1; background: var(--ink); border-radius: 2px; min-height: 2px; }
  .bars i.zero { background: var(--line); }
  .week { text-align: center; margin: 12px 8px 0; }
  .words { display: flex; flex-wrap: wrap; gap: 8px; }
  .words button { direction: ltr; }

  /* Characters to call (030): a contacts list; a character is ink, gold stays Mared's */
  .person { display: flex; align-items: center; gap: 12px; padding: 10px 14px; min-height: 64px; }
  .person + .person { border-top: 1px solid var(--line); }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--raised); color: var(--ink); display: grid; place-items: center; font-weight: 600; font-size: 18px; flex: none; }
  .person .who { flex: 1; min-width: 0; }
  .person .who b { display: block; font-weight: 600; }
  .person .who span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .round { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center; flex: none; }
  .round.ghost { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
  .round svg { width: 20px; height: 20px; }
  .add { flex: 1; border: 0; background: none; color: var(--ink); text-align: start; padding: 10px 0; text-decoration: underline; text-underline-offset: 3px; }

  .call[data-who="char"] .face .mark, .call:not([data-who="char"]) .avatar.big { display: none; }

  .sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; padding: calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 24px); }
  .sheet .bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; max-width: 560px; margin: 0 auto; }
  .sheet form { max-width: 560px; margin: 0 auto; }
  .field { display: block; margin-top: 14px; }
  .field > span { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin: 0 2px 6px; }
  .field input, .field textarea, .field select { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); padding: 12px 14px; }
  .field textarea { min-height: 96px; resize: vertical; line-height: 1.6; }
  .field small { display: block; font-size: 12px; color: var(--muted); margin: 4px 2px 0; }

  /* Putting Mared on the home screen: the steps for this phone's browser first, the others folded below */
  .homerow { width: 100%; border: 0; background: none; text-align: start; }
  .homerow img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
  .how { max-width: 560px; margin: 0 auto; }
  .how h2 { font-size: 22px; font-weight: 600; line-height: 30px; margin: 8px 0 4px; }
  .how .panel { margin-top: 12px; }
  .how h3 { font-size: 16px; font-weight: 600; margin: 0; padding: 14px 16px 0; }
  .how details > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 6px 16px; font-weight: 500; cursor: pointer; }
  .how details > summary::-webkit-details-marker { display: none; }
  .how details[open] > summary .chev { transform: rotate(180deg); }
  .how .note { font-size: 13px; color: var(--muted); padding: 0 16px 14px; margin: 0; }
  .steps { list-style: none; counter-reset: s; margin: 0; padding: 6px 16px 10px; }
  .steps li { counter-increment: s; display: flex; gap: 12px; padding: 8px 0; line-height: 1.7; }
  .steps li::before { content: counter(s); flex: none; width: 26px; height: 26px; margin-top: 1px; border-radius: 50%; background: var(--raised); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
  .steps b { font-weight: 600; }
  .ic { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; background: var(--raised); vertical-align: middle; margin: 0 2px; }
  .ic svg { width: 17px; height: 17px; }

  /* The tab bar */
  .tabbar { position: fixed; inset-inline: 0; bottom: 0; z-index: 10; display: flex; justify-content: space-around; background: var(--panel); border-top: 1px solid var(--line);
    padding: 6px 0 calc(env(safe-area-inset-bottom) + 4px); }
  .tabbar button { flex: 1; max-width: 140px; border: 0; background: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; font-weight: 500; padding: 2px 0; position: relative; }
  .tabbar svg { width: 24px; height: 24px; }
  .tabbar [aria-selected="true"] { color: var(--ink); }
  .badge { position: absolute; top: -3px; inset-inline-start: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--ink); color: var(--bg); font-size: 11px; line-height: 18px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="m" viewBox="20 20 162 180"><path fill="currentColor" fill-rule="evenodd" d="M54,84 a62,62 0 1 0 124,0 a62,62 0 1 0 -124,0 Z M98,52 L104.3,111.7 L117.8,96.7 L130.6,118 L140.5,112.4 L127.8,91.1 L147.1,89.1 Z"/><path fill="currentColor" d="M60,102 C36,124 22,152 32,175 C42,196 76,196 84,178 C90,163 77,151 64,157 C55,161 57,172 64,172 C53,174 48,160 57,149 C68,136 88,141 104,143 Z"/></symbol>
</svg>

<!-- Sign in: the lockup, then the 6-digit code from the email, or Google -->
<section id="s-in" class="screen" hidden>
  <div class="welcome">
    <div class="lockup" translate="no"><span class="en">Mared</span><svg class="mark" aria-hidden="true"><use href="#m"/></svg><span class="ar">مارد</span></div>
    <h1 class="hero" id="t-in-h">اتكلم أي لغة زي مكالمة</h1>
    <p class="muted" id="t-in-p">سجّل بنفس حساب مارد اللي على الكمبيوتر، وتقدّمك يبقى واحد هنا وهناك.</p>
  </div>
  <button class="btn ghost" type="button" id="google" hidden style="margin-bottom:12px">Google</button>
  <form id="email-form" class="stack" novalidate>
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="name@gmail.com" dir="ltr" aria-label="Email">
    <div class="err" id="email-err" role="alert"></div>
    <button class="btn" type="submit" id="t-send">ابعتلي كود</button>
  </form>

  const maredVoice = (code = LEARN) => ACCENT[code];
  // Learning the language the page speaks, a line that only says again what say just asked is dropped (Farah, 30 Oct
  // 2026: "no need to repeat the question twice").
  const repeats = (line, said) => {
    if (dialect() !== tg()[1]) return false;
    const words = line.toLowerCase().match(/\p{L}+/gu) || [], heard = new Set(said.toLowerCase().match(/\p{L}+/gu) || []);
    return words.length > 0 && words.filter((w) => heard.has(w)).length >= words.length * 0.6;
  };
  function languages() {
    const box = $("learn"); box.innerHTML = "";
    for (const [code, , , ar, en] of TARGETS) { const o = document.createElement("option"); o.value = code; o.textContent = T(ar, en); o.selected = code === tg()[0]; box.appendChild(o); }
    box.disabled = live;
  }
  $("learn").addEventListener("change", (e) => { LEARN = e.target.value; store.set("mared-talk-learn", LEARN); paintLevel(); });

  // ---- The level, A1 to C2 (029): Mared's judgement of how they speak, and the one they aim for. As Tutor.Core/Targets.cs Cefr. ----
  const CEFR = [["A1", "مبتدئ", "Beginner", "بتعرّف نفسك وتسأل وتجاوب عن حاجات بسيطة.", "You introduce yourself and ask and answer about simple things."],
    ["A2", "أساسي", "Elementary", "بتتكلم عن يومك وشغلك واللي حصل امبارح بجمل بسيطة.", "You talk about your day, your work and what happened yesterday in simple sentences."],
    ["B1", "متوسط", "Intermediate", "بتحكي وتقول رأيك وخططك، وتتصرّف في السفر.", "You tell stories, give your opinion and plans, and get by when travelling."],
    ["B2", "فوق المتوسط", "Upper intermediate", "بتناقش وتدافع عن رأيك بسهولة مع أهل اللغة.", "You discuss and defend your view with ease with native speakers."],
    ["C1", "متقدم", "Advanced", "بتتكلم بطلاقة ودقة في الشغل والدراسة، من غير ما تدوّر على الكلام.", "You speak fluently and precisely at work and in study, without searching for words."],
    ["C2", "متمكّن", "Proficient", "بتفهم وتقول كل حاجة تقريبًا زي أهل اللغة.", "You understand and say almost anything, like a native speaker."]];
  const rank = (l) => CEFR.findIndex((c) => c[0] === l);
  let levels = {};
  async function loadLevels() {
    try { levels = Object.fromEntries((await (await call("/rest/v1/rpc/speaking_levels", {})).json()).map((x) => [x.lang, x])); } catch (e) {}
    paintLevel();
  }
  function paintLevel() {
    const box = $("level"), mine = levels[tg()[0]] || {}, at = rank(mine.level), goal = rank(mine.aim);
    const c = at >= 0 ? CEFR[at] : null;
    box.innerHTML = `<div class="muted" style="font-size:13px;font-weight:500"></div><div class="big"></div><div class="muted"></div>` +
      `<div class="ladder">${CEFR.map((x, i) => `<span class="${i <= at ? "on" : ""} ${i === goal ? "aim" : ""}">${i === goal ? "🎯 " : ""}${x[0]}</span>`).join("")}</div><select aria-label=""></select><div class="muted" style="font-size:.85rem"></div>`;
    const [head, big, can, , pick, left] = box.children;
    left.style.fontSize = "13px";
    head.textContent = T("مستواك", "Your level");
    big.textContent = c ? `${c[0]} · ${T(c[1], c[2])}` : T("لسه هنعرفه", "Not known yet");
    big.style.color = c ? "" : "var(--muted)";
    can.textContent = c ? T(c[3], c[4]) : T("اتكلم معايا شوية وأنا هقيس مستواك بالمقياس العالمي، من A1 لـ C2.", "Talk with me a little and I'll measure your level on the international scale, from A1 to C2.");
    pick.setAttribute("aria-label", T("هدفك", "Your goal")); pick.style.marginBottom = "6px";
    for (const [v, ar, en] of [["", "اختار هدفك", "Pick your goal"], ...CEFR.map((x) => [x[0], `${x[0]} · ${x[1]}`, `${x[0]} · ${x[2]}`])]) {
      const o = document.createElement("option"); o.value = v; o.textContent = T(ar, en); o.selected = v === (mine.aim || ""); pick.appendChild(o);
    }
    pick.addEventListener("change", async () => {
      if (!pick.value) return;
      try { await call("/rest/v1/rpc/set_level_aim", { p_lang: tg()[0], p_aim: pick.value }); } catch (e) {}
      loadLevels();
    });
    left.textContent = goal < 0 ? T("اختار المستوى اللي عايز توصله، وأنا هوجّه الكلام ليه.", "Pick the level you want to reach, and I'll steer our talks toward it.")
      : at >= goal ? T("وصلت لهدفك! 🎉 اختار هدف أعلى.", "You reached your goal! 🎉 Pick a higher one.")
      : at < 0 ? T(`هدفك ${mine.aim}: هعرف مستواك من أول كلام بينا.`, `Your goal is ${mine.aim}: I'll find your level from our first talk.`)
      : T(`فاضلك ${goal - at} مستوى وتوصل ${mine.aim}.`, `${goal - at} level(s) to go to reach ${mine.aim}.`);
  }

  // ---- Characters (030): built-in and their own, called like contacts ----
  const fixes = () => store.get("mared-talk-fixes", "light");
  $("fixes").addEventListener("change", (e) => store.set("mared-talk-fixes", e.target.value));
  let people = [], who = null; // who: the character on this call; null: Mared
  const PHONE = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1l-2.3 2.2Z"/></svg>';
  const PEN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4Z"/></svg>';
  const initial = (name) => [...name.trim()][0] || "?";
  async function loadPeople() {
    const { data } = await db.from("characters").select("id,user_id,name,tagline,tagline_ar,persona,topics,context,voice").order("sort").order("created_at");
    people = data || []; paintPeople();
  }
  function paintPeople() {
    const box = $("people"); box.innerHTML = "";
    for (const p of people) {
      const row = document.createElement("div"); row.className = "person";
      row.innerHTML = '<span class="avatar" aria-hidden="true"></span><span class="who"><b></b><span></span></span>';
      row.querySelector(".avatar").textContent = initial(p.name);
      row.querySelector("b").textContent = p.name;
      row.querySelector(".who span").textContent = (LANG === "ar" && p.tagline_ar) || p.tagline;
      if (p.user_id) {
        const e = document.createElement("button"); e.type = "button"; e.className = "round ghost"; e.innerHTML = PEN;
        e.setAttribute("aria-label", T(`عدّل ${p.name}`, `Edit ${p.name}`)); e.addEventListener("click", () => editor(p)); row.appendChild(e);
      }
      const c = document.createElement("button"); c.type = "button"; c.className = "round"; c.innerHTML = PHONE;
      c.setAttribute("aria-label", T(`كلّم ${p.name}`, `Call ${p.name}`)); c.addEventListener("click", () => { if (!live) { who = p; start(); } }); row.appendChild(c);
      box.appendChild(row);
    }
    const add = document.createElement("div"); add.className = "person";
    add.innerHTML = '<span class="avatar" aria-hidden="true">+</span><button type="button" class="add"></button>';
    add.querySelector("button").textContent = T("اعمل شخصية بنفسك", "Create your own character");
    add.querySelector("button").addEventListener("click", () => editor(null));
    box.appendChild(add);
  }

  // The editor: a character of their own, fed with what they want it to know.
  let editing = null, voiceList = null;
  function count() { $("ed-count").textContent = `${$("ed-context").value.length.toLocaleString()} / 12,000`; }
  $("ed-context").addEventListener("input", count);
  async function editor(p) {
    editing = p;
    $("editor").hidden = false; document.body.style.overflow = "hidden";
    $("ed-title").textContent = p ? p.name : T("شخصية جديدة", "New character");
    $("ed-name").value = p?.name || ""; $("ed-tag").value = p?.tagline || ""; $("ed-persona").value = p?.persona || "";
    $("ed-topics").value = p?.topics || ""; $("ed-context").value = p?.context || "";
    $("ed-delete").hidden = !p; $("ed-err").textContent = ""; count();
    if (!voiceList) { try { voiceList = (await (await call("/functions/v1/voice", { mode: "voices" })).json()).filter((v) => !v.mine); } catch (e) { voiceList = []; } }
    const box = $("ed-voice"); box.innerHTML = "";
    for (const v of [{ id: "", name: T("صوت مارد", "Mared's voice") }, ...voiceList]) { const o = document.createElement("option"); o.value = v.id; o.textContent = v.name; o.selected = v.id === (p?.voice || ""); box.appendChild(o); }
    $("ed-name").focus();
  }
  function closeEditor() { $("editor").hidden = true; document.body.style.overflow = ""; editing = null; }
  $("ed-cancel").addEventListener("click", closeEditor);

  // Putting Mared on the home screen (Hassan, 30 Oct 2026: "proper instructions... whether it's Safari, Chrome, or an
  // iPhone or not"): the steps for the browser this page is open in come first, every other one folded below, with the
  // browsers' own icons drawn in so the learner can find the button.
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  const inApp = /FBAN|FBAV|FB_IAB|Instagram|Line\/|Snapchat|musical_ly|TikTok|LinkedInApp|Twitter|GSA\//.test(ua);
  const here = inApp ? "inapp" : ios ? (/CriOS|EdgiOS|FxiOS|OPiOS/.test(ua) ? "ios-other" : "ios-safari")
    : /Android/.test(ua) ? (/SamsungBrowser/.test(ua) ? "samsung" : /Firefox/.test(ua) ? "firefox" : "android-chrome") : "computer";
  const svg = (d) => `<span class="ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}</svg></span>`;
  const IC = {
    share: svg('<path d="M12 14V3M8 7l4-4 4 4"/><path d="M8.5 10H7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7a2 2 0 0 0-2-2h-1.5"/>'),
    more: svg('<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>'),
    kebab: svg('<circle cx="12" cy="5" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="19" r="1.3" fill="currentColor"/>'),
    menu: svg('<path d="M4 7h16M4 12h16M4 17h16"/>'),
    add: svg('<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M12 8v8M8 12h8"/>'),
  };
  // A button's name as the phone shows it: in Arabic, the English name too, as many phones here are set to English.
  const b = (ar, en) => (LANG === "ar" ? `<b>${ar}</b>${en ? ` <span class="muted" dir="ltr">(${en})</span>` : ""}` : `<b>${en}</b>`);
  const openIt = () => T("افتح مارد من الأيقونة اللي ظهرت على الشاشة الرئيسية.", "Open Mared from its new icon on your home screen.");
  const GUIDES = () => [
    { id: "ios-safari", title: T("آيفون · Safari", "iPhone · Safari"), steps: [
      T(`دوس على زرار المشاركة ${IC.share} تحت. (في iOS 26 دوس الأول على ${IC.more} وبعدين «مشاركة».)`, `Tap the Share button ${IC.share} at the bottom. (On iOS 26, tap ${IC.more} first, then Share.)`),
      T(`انزل لتحت ودوس ${b("إضافة إلى الشاشة الرئيسية", "Add to Home Screen")} ${IC.add}.`, `Scroll down and tap ${b("", "Add to Home Screen")} ${IC.add}.`),
      T(`سيب ${b("فتح كتطبيق ويب", "Open as Web App")} شغّال، ودوس ${b("إضافة", "Add")} فوق.`, `Leave “Open as Web App” on, and tap ${b("", "Add")} at the top.`),
      openIt(),
      T("سجّل دخول مرة كمان جوّه: الآيفون بيفصل التطبيق عن Safari.", "Sign in once more inside it: the iPhone keeps it separate from Safari."),
    ] },
    { id: "ios-other", title: T("آيفون · Chrome أو Edge أو Firefox", "iPhone · Chrome, Edge or Firefox"), steps: [
      T(`دوس على زرار المشاركة ${IC.share} جنب العنوان فوق. (لو مش لاقيه: ${IC.more} وبعدين «مشاركة».)`, `Tap the Share button ${IC.share} next to the address at the top. (Can't see it? ${IC.more}, then Share.)`),
      T(`دوس ${b("إضافة إلى الشاشة الرئيسية", "Add to Home Screen")} ${IC.add}. لو مش ظاهر، دوس «المزيد» أو انزل لتحت.`, `Tap ${b("", "Add to Home Screen")} ${IC.add}. Not there? Tap More or scroll down.`),
      T(`دوس ${b("إضافة", "Add")}.`, `Tap ${b("", "Add")}.`),
      openIt(),
      T("سجّل دخول مرة كمان جوّه: الآيفون بيفصل التطبيق عن المتصفح.", "Sign in once more inside it: the iPhone keeps it separate from the browser."),
    ] },
    { id: "android-chrome", title: T("أندرويد · Chrome", "Android · Chrome"), steps: [
      T(`دوس ${IC.kebab} فوق في الجنب.`, `Tap ${IC.kebab} at the top corner.`),
      T(`دوس ${b("إضافة إلى الشاشة الرئيسية", "Add to Home screen")} أو ${b("تثبيت التطبيق", "Install app")}.`, `Tap ${b("", "Add to Home screen")} or ${b("", "Install app")}.`),
      T(`دوس ${b("تثبيت", "Install")}.`, `Tap ${b("", "Install")}.`),
      openIt(),
    ] },
    { id: "samsung", title: T("أندرويد · Samsung Internet", "Android · Samsung Internet"), steps: [
      T(`دوس ${IC.menu} تحت في الجنب.`, `Tap ${IC.menu} at the bottom corner.`),
      T(`دوس ${b("إضافة صفحة إلى", "Add page to")}، وبعدين ${b("الشاشة الرئيسية", "Home screen")}.`, `Tap ${b("", "Add page to")}, then ${b("", "Home screen")}.`),
      T(`دوس ${b("إضافة", "Add")}.`, `Tap ${b("", "Add")}.`),
      openIt(),
    ] },
    { id: "firefox", title: T("أندرويد · Firefox", "Android · Firefox"), steps: [
      T(`دوس ${IC.kebab}.`, `Tap ${IC.kebab}.`),
      T(`دوس ${b("تثبيت", "Install")} أو ${b("إضافة إلى الشاشة الرئيسية", "Add to Home screen")}.`, `Tap ${b("", "Install")} or ${b("", "Add to Home screen")}.`),
      T(`دوس ${b("إضافة", "Add")}.`, `Tap ${b("", "Add")}.`),
      openIt(),
    ] },
    { id: "inapp", title: T("فاتح الصفحة من جوّه إنستجرام أو واتساب أو فيسبوك", "Opened inside Instagram, WhatsApp or Facebook"), steps: [
      T("التطبيقات دي مبتعرفش تحط اختصار. انسخ اللينك بالزرار اللي تحت.", "These apps can't add a shortcut. Copy the link with the button below."),
      T("افتح Safari على الآيفون، أو Chrome على الأندرويد، والصق اللينك فوق.", "Open Safari on an iPhone, or Chrome on Android, and paste the link at the top."),
      T("كمّل بالخطوات بتاعة المتصفح ده من القايمة دي.", "Then follow that browser's steps in this list."),
    ], copy: true },
    { id: "computer", title: T("على الكمبيوتر", "On a computer"), steps: [
      T(`افتح <b dir="ltr">yamared.com/talk</b> على موبايلك، وكمّل بالخطوات بتاعة موبايلك.`, `Open ${b("", "yamared.com/talk")} on your phone, then follow your phone's steps.`),
      T("على الكمبيوتر، تطبيق مارد للويندوز فيه نفس المكالمات.", "On a computer, the Mared app for Windows has the same calls."),
    ] },
  ];
  function guideHtml(g) {
    return `<ol class="steps">${g.steps.map((s) => `<li><span>${s}</span></li>`).join("")}</ol>` +
      (g.copy ? `<div style="padding:0 16px 16px"><button class="btn ghost" type="button" data-copy>${T("انسخ اللينك", "Copy the link")}</button></div>` : "");
  }
  function paintHome() {
    $("home-done").textContent = T("تمام", "Done");
    $("home-h").textContent = T("حط مارد على الشاشة الرئيسية", "Put Mared on your home screen");
    $("home-p").textContent = T("بعدها يفتح زي أي تطبيق: من غير متصفح ولا عنوان، بلمسة واحدة.", "Then it opens like any app: no browser bar, no address, one tap.");
    $("home-install").textContent = T("ثبّت مارد", "Install Mared");
    const all = GUIDES(), mine = all.find((g) => g.id === here);
    const first = here === "computer" ? "" : `<div class="panel"><h3>${mine.title}</h3>${guideHtml(mine)}</div>`;
    const label = here === "computer" ? T("اختار موبايلك", "Pick your phone") : T("موبايل أو متصفح تاني؟", "Another phone or browser?");
    $("home-guides").innerHTML = first + `<div class="label">${label}</div><div class="panel">` +
      all.filter((g) => g.id !== here || here === "computer").map((g) => `<details class="row" style="display:block;padding:0"><summary>${g.title}<span class="chev" aria-hidden="true">⌄</span></summary>${guideHtml(g)}</details>`).join("") + "</div>";
  }
  // Chrome on Android (and Edge) can install in one tap: the button shows only when the browser offers it.
  let installer = null;
  addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installer = e; $("home-install").hidden = false; });
  addEventListener("appinstalled", () => { installer = null; $("home-install").hidden = true; });
  $("home-install").addEventListener("click", async () => { if (!installer) return; installer.prompt(); await installer.userChoice; installer = null; $("home-install").hidden = true; });
  document.querySelectorAll("[data-home]").forEach((x) => x.addEventListener("click", () => { $("home").hidden = false; document.body.style.overflow = "hidden"; }));
  $("home-done").addEventListener("click", () => { $("home").hidden = true; document.body.style.overflow = ""; });
  $("home-guides").addEventListener("click", async (e) => {
    const c = e.target.closest("[data-copy]"); if (!c) return;
    const url = location.origin + location.pathname;
    try { await navigator.clipboard.writeText(url); c.textContent = T("اتنسخ ✓", "Copied ✓"); } catch (err) { prompt(T("انسخ اللينك ده:", "Copy this link:"), url); }
  });
  $("ed-hear").addEventListener("click", () => { sound(); speak(`Hi, I'm ${$("ed-name").value.trim() || "your new friend"}. What shall we talk about?`, "en", $("ed-voice").value || undefined); });
  $("ed-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const row = { name: $("ed-name").value.trim(), tagline: $("ed-tag").value.trim(), persona: $("ed-persona").value.trim(), topics: $("ed-topics").value.trim(), context: $("ed-context").value.trim(), voice: $("ed-voice").value || null };
    if (!row.name) { $("ed-err").textContent = T("اكتب اسم.", "Give it a name."); $("ed-name").focus(); return; }
    $("ed-save").disabled = true;
    const { error } = editing ? await db.from("characters").update(row).eq("id", editing.id) : await db.from("characters").insert(row);
    $("ed-save").disabled = false;
    if (error) { $("ed-err").textContent = /row-level/i.test(error.message) ? T("وصلت لأقصى عدد شخصيات (30).", "You've reached the most characters (30).") : T("ما اتحفظتش. جرّب تاني.", "Didn't save. Try again."); return; }
    closeEditor(); loadPeople();
  });
  $("ed-delete").addEventListener("click", async () => {
    if (!editing || !confirm(T(`تمسح ${editing.name}؟`, `Delete ${editing.name}?`))) return;
    const { error } = await db.from("characters").delete().eq("id", editing.id);
    if (error) { $("ed-err").textContent = T("ما اتمسحتش. جرّب تاني.", "Didn't delete. Try again."); return; }
    closeEditor(); loadPeople();
  });

  // ---- Topics ----
  const TOPICS = [["", "اختارلي", "Surprise me"], ["science", "علوم", "Science"], ["technology", "تكنولوجيا", "Technology"], ["films and series", "أفلام ومسلسلات", "Films and series"],
    ["football", "كورة", "Football"], ["history", "تاريخ", "History"], ["travel", "سفر", "Travel"], ["a job interview role-play: you are the interviewer", "مقابلة شغل", "Job interview"],
    ["everyday slang and idioms people really use", "كلام الشارع", "Everyday slang"]];
  let topic = "";
  function chips() {
    const box = $("chips"); box.innerHTML = "";
    $("learn").disabled = live; // a call keeps its language
    if (live) return;
    for (const [value, ar, en] of TOPICS) {
      const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = T(ar, en);
      b.setAttribute("aria-pressed", String(topic === value));
      b.addEventListener("click", () => { topic = value; chips(); });
      box.appendChild(b);
    }
  }

  // ---- The call ----
  const SR = 16000, TURN_MAX = 30 * SR, STUCK_MS = 60000;
  let live = false, ctx = null, stream = null, ws = null, wsLang = undefined, playing = false, quietUntil = 0, busy = false, wake = null;
  let turnPcm = [], turnLen = 0, history = "", line = "", expect = "none", stucks = 0, lastHeardAt = 0, stuckTimer = null, proc = null;
  const dialect = () => (LANG === "ar" ? "eg" : "en");
  const notes = () => store.get("mared-talk-notes", []);

  function status(t) { $(live ? "status" : "after").textContent = t; } // after a call: under the start button, the call screen being closed
  function orb(state) {
    $("call").hidden = !live;
    document.body.style.overflow = live ? "hidden" : "";
    $("call").dataset.state = state || "listening";
    $("call").dataset.who = who ? "char" : "mared";
    $("call-avatar").textContent = who ? initial(who.name) : "";
    $("t-bubble-name").textContent = $("call-name").textContent = who ? who.name : T("مارد", "Mared");
    clock();
  }

  // The line under the name, as a phone shows it: Calling…, Ringing…, then the call's time and the language.
  let callAt = 0, dialAt = 0, clockTimer = null;
  function clock() {
    const s = Math.floor((Date.now() - callAt) / 1000);
    $("call-sub").textContent = !callAt ? (Date.now() - dialAt < 1200 ? T("بيتصل…", "Calling…") : T("بيرن…", "Ringing…"))
      : `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")} · ${T(tg()[3], tg()[4])}`;
  }
  // The ringback while the other side picks up (it covers the connecting time, as on a real call), and the hang-up tone.
  let ringing = null;
  function ring(on) {
    if (!on) { ringing?.(); ringing = null; return; }
    if (ringing || !ctx) return;
    const g = ctx.createGain(); g.gain.value = 0; g.connect(ctx.destination);
    const tones = [440, 480].map((f) => { const o = ctx.createOscillator(); o.frequency.value = f; o.connect(g); o.start(); return o; });
    const beat = () => { const t = ctx.currentTime; g.gain.setValueAtTime(0.05, t); g.gain.setValueAtTime(0, t + 1.6); };
    beat(); const every = setInterval(beat, 3600);
    ringing = () => { clearInterval(every); tones.forEach((o) => o.stop()); g.disconnect(); };
  }
  function hangTone() {
    if (!ctx) return;
    const g = ctx.createGain(); g.connect(ctx.destination);
    const o = ctx.createOscillator(); o.frequency.value = 480; o.connect(g); o.start();
    const t = ctx.currentTime; g.gain.setValueAtTime(0, t);
    for (let i = 0; i < 3; i++) { g.gain.setValueAtTime(0.05, t + i * 0.25); g.gain.setValueAtTime(0, t + i * 0.25 + 0.15); }
    o.stop(t + 0.8);
  }
  let muted = false;
  const captions = () => store.get("mared-talk-captions", true);
  $("mute").addEventListener("click", () => { muted = !muted; $("call").dataset.muted = String(muted); paint(); });
  $("cc").addEventListener("click", () => { store.set("mared-talk-captions", !captions()); paint(); });

  $("orb").addEventListener("click", () => { if (!live) { who = null; start(); } });
  $("t-start").addEventListener("click", () => { if (!live) { who = null; start(); } });
  $("hangup").addEventListener("click", () => { hangTone(); end(T("خلصنا.", "Done.")); });

  async function start() {
    sound(); // made from the tap itself: iPhones only allow sound that a tap started
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
    } catch (e) { status(T("محتاج إذن الميكروفون عشان نتكلم.", "I need the microphone to talk.")); return; }
    live = true; history = ""; line = ""; expect = "none"; stucks = 0; prev = ""; muted = false; callAt = 0; dialAt = Date.now();
    $("call").dataset.muted = "false"; chips(); orb("thinking"); paint(); $("after").textContent = "";
    clearInterval(clockTimer); clockTimer = setInterval(clock, 500);
    ring(true);
    for (const id of ["say", "line", "gloss", "fix", "heard"]) $(id).textContent = "";
    $("bubble").hidden = true;
    try { wake = await navigator.wakeLock?.request("screen"); } catch (e) {} // the screen stays on, so the mic does
    const src = ctx.createMediaStreamSource(stream);
    proc = ctx.createScriptProcessor(4096, 1, 1);
    proc.onaudioprocess = (e) => {
      if (!live) return;
      const f = e.inputBuffer.getChannelData(0);
      const pcm = down(f, ctx.sampleRate);
      const quiet = busy || muted || (!barge() && (playing || performance.now() < quietUntil));
      let sq = 0; for (let i = 0; i < f.length; i += 16) sq += f[i] * f[i];
      $("call").style.setProperty("--lvl", quiet ? "0" : Math.min(1, Math.sqrt(sq / (f.length / 16)) * 8).toFixed(2)); // the orb follows their voice
      if (!quiet) { turnPcm.push(pcm); turnLen += pcm.length; while (turnLen - turnPcm[0].length > TURN_MAX) turnLen -= turnPcm.shift().length; }
      send(quiet ? new Int16Array(pcm.length) : pcm); // silence while Mared talks: it never hears itself
    };
    src.connect(proc); proc.connect(ctx.destination);
    listen(who ? tg()[1] : (dialect() === "en" ? "en" : null)).catch(() => {}); // connected while it rings, not after the first words
    await turn("start", "", null);
  }

  function end(say) {
    if (!live) return;
    live = false; busy = false; clearInterval(stuckTimer); clearTimeout(holdTimer); held = ""; ring(false); clearInterval(clockTimer);
    try { ws?.close(); } catch (e) {} ws = null; wsLang = undefined;
    stream?.getTracks().forEach((t) => t.stop()); stream = null;
    try { proc?.disconnect(); } catch (e) {} proc = null;
    try { wake?.release(); } catch (e) {}
    try { playingNow?.stop(); } catch (e) {} playing = false;
    orb(); chips(); status(say || ""); progress();
  }
  document.addEventListener("visibilitychange", () => { if (document.hidden && live) end(T("وقفنا لما قفلت الشاشة. دوس «ابدأ» نكمّل.", "Paused when the screen closed. Tap Start to carry on.")); });

  // 48 or 44.1 kHz floats to 16 kHz 16-bit: each output sample the average of the input it covers.
  function down(f, rate) {
    const ratio = rate / SR, n = Math.floor(f.length / ratio), out = new Int16Array(n);
    for (let i = 0; i < n; i++) {
      let s = 0, a = Math.floor(i * ratio), b = Math.min(f.length, Math.floor((i + 1) * ratio));
      for (let j = a; j < b; j++) s += f[j];
      const v = Math.max(-1, Math.min(1, s / Math.max(1, b - a)));
      out[i] = v < 0 ? v * 0x8000 : v * 0x7fff;
    }
    return out;
  }
  const b64 = (bytes) => { let s = ""; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); };
  function send(pcm) {
    if (ws?.readyState !== 1) return;
    ws.send(JSON.stringify({ message_type: "input_audio_chunk", audio_base_64: b64(new Uint8Array(pcm.buffer)), commit: false, sample_rate: SR }));
  }
  function wav() {
    if (turnLen < SR / 2) return null; // under half a second: nothing to score
    const bytes = new Uint8Array(44 + turnLen * 2), v = new DataView(bytes.buffer);
    const text = (at, s) => { for (let i = 0; i < 4; i++) bytes[at + i] = s.charCodeAt(i); };
    text(0, "RIFF"); v.setUint32(4, 36 + turnLen * 2, true); text(8, "WAVE"); text(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); text(36, "data"); v.setUint32(40, turnLen * 2, true);
    let at = 44; for (const c of turnPcm) { bytes.set(new Uint8Array(c.buffer), at); at += c.byteLength; }
    return b64(bytes);
  }

  // The live transcriber in the language the next answer comes in; it ends each turn after 1.5 s of silence (2 s felt
  // slow, 30 Oct 2026; a sentence that stopped midway waits longer, below).
  async function listen(lang) {
    if (ws && ws.readyState <= 1 && wsLang === lang) return;
    try { ws?.close(); } catch (e) {}
    const { token } = await (await call("/functions/v1/voice", { mode: "stt_token" })).json();
    const q = new URLSearchParams({ model_id: "scribe_v2_realtime", audio_format: "pcm_16000", commit_strategy: "vad", vad_silence_threshold_secs: "1.5", token });
    if (lang) q.set("language_code", lang);
    ws = new WebSocket("wss://api.elevenlabs.io/v1/speech-to-text/realtime?" + q);
    wsLang = lang;
    ws.onmessage = (m) => {
      let msg; try { msg = JSON.parse(m.data); } catch (e) { return; }
      const text = (msg.text || "").trim();
      if (msg.message_type === "partial_transcript" && text && !busy) {
        if (playing && barge() && !echo(text)) { cutNow = true; try { playingNow?.stop(); } catch (e) {} }
        if (!playing || cutNow) { $("heard").textContent = text; lastHeardAt = Date.now(); }
      }
      else if (msg.message_type === "committed_transcript" && text.replace(/[^\p{L}]/gu, "").length >= 2 && !busy && (!playing || cutNow)) hold(text);
    };
  }

  // A turn that stopped mid-sentence ("because…", «عشان…»): they are thinking, so it waits 3 s more, longer while they
  // talk on. As Speaking.Unfinished in the app.
  const LEADS = new Set(("and but because cause cuz so or the a an to of with that which who when if um uh er erm like my your is was are were in on at " +
    "for than then about from into just really very maybe actually think mean y pero porque que de el la los las un una en con para por o mi muy pues este " +
    "und aber weil dass der die das ein eine mit zu von für oder ich sehr also äh ähm e ma perché perche che di il lo uno per mio molto quindi allora " +
    "и но потому что в на с или а это очень ну чтобы אבל כי או עם של את גם אז אם כאילו و بس عشان لان لأن اللي يعني في من مع او أو ان إن انا أنا").split(" "));
  const ZH_LEADS = ["因为", "但是", "可是", "所以", "然后", "如果", "和", "的", "就是", "那个"];
  function unfinished(t) {
    t = t.trim();
    if (!t) return false;
    if (/[,\-—،…]$/.test(t) || t.endsWith("...")) return true;
    if (ZH_LEADS.some((z) => t.replace(/[。，.,]+$/, "").endsWith(z))) return true;
    const last = (t.split(/\s+/).pop() || "").replace(/[^\p{L}]/gu, "").toLowerCase();
    return LEADS.has(last);
  }
  let held = "", holdTimer = null;
  function hold(text) {
    held = held ? held + " " + text : text;
    clearTimeout(holdTimer);
    if (!unfinished(held)) { const all = held; held = ""; return answer(all); }
    $("heard").textContent = held + " …";
    holdTimer = setTimeout(function wait() {
      if (Date.now() - lastHeardAt < 1000) { holdTimer = setTimeout(wait, 500); return; } // still talking
      const all = held; held = "";
      if (all && live && !busy) answer(all);
    }, 3000);
  }

  const STOP = /^(stop|end|bye|خلاص|كفايه|كفاية|وقف|وقّف|بطل|بطّل)([\s.!]|$)/i;
  function answer(text) {
    try { playingNow?.stop(); } catch (e) {} // they talked over Mared: it stops
    if (STOP.test(text.trim()) && text.trim().split(/\s+/).length <= 3) return end(T("تمام، وقفنا.", "OK, we stopped."));
    $("heard").textContent = text;
    turn("answer", text, wav());
  }

  // Talking over Mared (a phone's echo cancellation keeps its own voice out): on unless turned off. A partial transcript
  // that is mostly Mared's own words is its echo, not the learner.
  const barge = () => store.get("mared-talk-barge", true);
  let spokenNow = "", cutNow = false, gen = 0;
  function echo(text) {
    const words = text.toLowerCase().match(/\p{L}+/gu) || [];
    if (words.length < 3) return true; // too little to cut Mared off for
    const said = new Set(spokenNow.toLowerCase().match(/\p{L}+/gu) || []);
    return words.filter((w) => said.has(w)).length >= words.length * 0.6;
  }

  let prev = ""; // how their last answer sounded: scored while the reply was written, sent with the next turn
  async function turn(ev, heard, audio) {
    const my = ++gen;
    busy = true; if (callAt) status(""); orb("thinking");
    let firstP = null, secondP = null, saying = null, t = null;
    // What is said, the moment it comes: voiced and played while the rest of the turn is still being written.
    const sayNow = (say) => {
      if (firstP || !live || my !== gen) return;
      firstP = who ? voice(say, tg()[1], who.voice) : voice(say, dialect() === "en" ? "en" : "ar", maredVoice());
      $("say").textContent = say; $("bubble").hidden = !say; $("line").textContent = ""; $("gloss").textContent = ""; $("fix").textContent = ""; $("heard").textContent = "";
      spokenNow = say; cutNow = false;
      saying = (async () => {
        const mp3 = await firstP;
        if (!live || my !== gen) return;
        ring(false); if (!callAt) callAt = Date.now(); // they picked up
        orb("speaking"); busy = false; // from here they may talk over
        await play(Promise.resolve(mp3));
      })();
    };
    try {
      const r = await call("/functions/v1/practice", {
        mode: "talk", topic: who ? "" : topic, course: "", lesson: who ? who.name : "Talk", character: who ? who.id : "", fixes: fixes(), goal: "free conversation", notes: notes().join("\n").slice(-4000), learner: "",
        event: ev, heard, line, expect, history: history.slice(-4000), review: "", audio, dialect: dialect(), learn: tg()[0],
        day: new Date().toLocaleDateString("en-CA"), level: (levels[tg()[0]] || {}).level || "", aim: (levels[tg()[0]] || {}).aim || "", prev, stream: true,
      });
      const reader = r.body.getReader(), dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buf += dec.decode(value, { stream: true });
        for (let nl; (nl = buf.indexOf("\n")) >= 0;) {
          const msg = JSON.parse(buf.slice(0, nl)); buf = buf.slice(nl + 1);
          if (msg.error) throw Object.assign(new Error(msg.error), { status: 502 });
          if (msg.status !== undefined) t = msg; // the whole turn
          else if (msg.say !== undefined) sayNow(msg.say);
          else if (msg.line && !secondP && !repeats(msg.line, spokenNow)) secondP = voice(msg.line, tg()[1], who?.voice || maredVoice()); // made while the first plays
        }
      }
      if (!t) throw Object.assign(new Error("no turn"), { status: 502 });
      if (!live || my !== gen) return;
      sayNow(t.say); // an older server sends no early words
      if (t.line && repeats(t.line, t.say)) { t.line = ""; t.gloss = ""; }
      prev = t.prev || "";
      if (ev === "answer") history += "Learner: " + heard + "\n";
      history += (who ? who.name : "Mared") + ": " + t.say + (t.line ? " [line: " + t.line + "]" : "") + "\n";
      if (t.note) store.set("mared-talk-notes", [...notes(), t.note].slice(-40));
      if (t.topic && !who) topic = t.topic;
      $("line").textContent = t.line || ""; $("gloss").textContent = t.gloss || "";
      let up = "";
      if (t.level) { // Mared judged a new level: kept by the server already
        const before = rank((levels[tg()[0]] || {}).level);
        levels[tg()[0]] = { ...(levels[tg()[0]] || {}), level: t.level }; paintLevel();
        if (rank(t.level) > before) up = before < 0 ? T(`مستواك: ${t.level}`, `Your level: ${t.level}`) : T(`🎉 مستواك بقى ${t.level}!`, `🎉 You're now ${t.level}!`);
      }
      $("fix").textContent = [up, t.fix ? "✓ " + t.fix : "", t.better ? T("أحلى: ", "Better: ") + t.better : ""].filter(Boolean).join(" · ");
      line = t.line || ""; expect = t.expect || "reply";
      stucks = ev === "stuck" ? stucks : 0;
      spokenNow = t.say + " " + (t.line || "");
      if (t.line && !secondP) secondP = voice(t.line, tg()[1], who?.voice || maredVoice());
      if (!t.line) secondP = null; // a dropped repeat is never played
      await saying;
      if (live && !cutNow && my === gen && secondP) { orb("speaking"); await play(secondP); }
      if (!live || my !== gen) return;
      if (cutNow) { orb(); status(""); return; } // already talking: the same connection hears the rest
      turnPcm = []; turnLen = 0; quietUntil = performance.now() + 300;
      await listen(expect === "repeat" || expect === "answer" ? tg()[1] : (dialect() === "en" ? "en" : null));
      orb(); status("");
      lastHeardAt = Date.now();
      clearInterval(stuckTimer);
      stuckTimer = setInterval(() => {
        if (!live || busy || playing || muted || Date.now() - lastHeardAt < STUCK_MS) return;
        clearInterval(stuckTimer);
        if (++stucks >= 3) end(T("قفلت المكالمة عشان مفيش كلام. اتصل تاني وقت ما تحب.", "The call ended after a long silence. Call again whenever you like."));
        else turn("stuck", "", null);
      }, 2000);
    } catch (e) {
      if (e.status === 404 && who) { end(T(`${who.name} مش موجود دلوقتي.`, `${who.name} isn't there any more.`)); loadPeople(); }
      else if (e.status === 402) end(T("اللي متاحلك خلص. اشترك من yamared.com/start ونكمّل.", "You've used what you had. Subscribe at yamared.com/start and we'll carry on."));
      else if (e.status === 401) { end(); await db.auth.signOut(); }
      else end(T("المكالمة وقعت. اتصل تاني.", "The call dropped. Call again."));
      return;
    } finally { if (my === gen && !saying) busy = false; }
  }

  // One audio engine for the mic and Mared's voice, made (or woken) from a tap.
  function sound() {
    ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  let playingNow = null;
  const voice = (text, language, v) => (text ? call("/functions/v1/voice", { mode: "tts", text, language, ...(v ? { voice: v } : {}) }).then((r) => r.arrayBuffer()).catch(() => null) : null);
  const speak = (text, language, v) => play(voice(text, language, v));
  async function play(pending) {
    if (!pending) return;
    try {
      const mp3 = await pending;
      if (!mp3 || !ctx) return;
      const clip = await ctx.decodeAudioData(mp3);
      const src = ctx.createBufferSource();
      src.buffer = clip; src.connect(ctx.destination);
      playing = true; playingNow = src;
      await new Promise((done) => { src.onended = done; src.start(); });
    } catch (e) { /* no voice: the words are on the card */ }
    finally { playing = false; playingNow = null; quietUntil = performance.now() + 300; }
  }

  // ---- Progress: the server's, the same as the Windows app's ----
  async function progress() {
    const { data: p } = await db.rpc("speaking_stats", { p_days: 30 });
    const box = $("progress"); box.innerHTML = "";
    if (!p) return;
    const day = (d) => d.toLocaleDateString("en-CA");
    const today = new Date(), active = new Set(p.active_days || []);
    let streak = 0, d = new Date(today);
    if (!active.has(day(d))) d.setDate(d.getDate() - 1); // a streak that ended yesterday is still alive today
    while (active.has(day(d))) { streak++; d.setDate(d.getDate() - 1); }
    $("streak").textContent = streak > 0 ? T(`🔥 ${streak} يوم ورا بعض`, `🔥 ${streak} days in a row`) : T("دقيقتين النهارده وتبدأ سلسلتك", "Two minutes today starts your streak");
    if (!p.talks && !p.words_total) return;
    const days = [...Array(14)].map((_, i) => { const x = new Date(today); x.setDate(x.getDate() - 13 + i); return day(x); });
    const by = Object.fromEntries((p.days || []).map((x) => [x.day, x]));
    const per = (f) => days.map((x) => (by[x] ? f(by[x]) : 0));
    const learned = days.map((x) => (p.words || []).filter((w) => w.day === x).length);
    const tile = (n, name, values) => {
      const max = Math.max(1, ...values);
      return `<div class="tile"><b>${n}</b><span class="muted">${name}</span><div class="bars" aria-hidden="true">${values.map((v) => `<i class="${v ? "" : "zero"}" style="height:${Math.max(2, (v / max) * 30)}px"></i>`).join("")}</div></div>`;
    };
    box.innerHTML = `<div class="label">${T("آخر أسبوعين", "Last two weeks")}</div><div class="tiles">` +
      tile(p.words_total, T("كلمة اتعلمتها", "words learned"), learned) + tile(p.words_spoken, T("كلمة قلتها", "words spoken"), per((x) => x.words_spoken)) +
      tile(p.talks, T("محادثة", "talks"), per((x) => x.talks)) + tile(Math.floor(p.seconds / 60), T("دقيقة بصوتك", "minutes of your voice"), per((x) => x.seconds / 60)) + `</div>`;
    // This week: the last 7 days, as the Windows app's weekly message.
    const week = days.slice(-7), sum = (f) => week.reduce((a, x) => a + (by[x] ? f(by[x]) : 0), 0);
    const newWords = (p.words || []).filter((w) => week.includes(w.day)).length;
    if (sum((x) => x.words_spoken) > 0) box.insertAdjacentHTML("beforeend", `<p class="muted week">${T(
      `الأسبوع ده: قلت ${sum((x) => x.words_spoken)} كلمة في ${sum((x) => x.talks)} محادثة، واتعلمت ${newWords} كلمة جديدة.`,
      `This week: ${sum((x) => x.words_spoken)} words in ${sum((x) => x.talks)} talks, and ${newWords} new words.`)}</p>`);
    if ((p.words || []).length) {
      const h = document.createElement("div"); h.className = "label"; h.textContent = T("كلماتك: دوس تسمعها", "Your words: tap to hear");
      const list = document.createElement("div"); list.className = "words";
      for (const w of p.words.slice(0, 40)) {
        const b = document.createElement("button"); b.type = "button"; b.className = "chip"; b.textContent = w.gloss ? `${w.en} · ${w.gloss}` : w.en;
        b.addEventListener("click", () => { if (!live) { sound(); speak(w.en, tg()[1], maredVoice()); } });
        list.appendChild(b);
      }
      box.append(h, list);
    }
  }

  // ---- Review: the deck, scheduled as Anki does on the server (027); the same cards as the Windows app ----
  const wait = (s) => {
    const n = (x, d = 0) => Math.round(x * 10 ** d) / 10 ** d;
    if (s < 3600) return T(`${Math.max(1, n(s / 60))} دقيقة`, `${Math.max(1, n(s / 60))}m`);
    if (s < 86400) return T(`${n(s / 3600)} ساعة`, `${n(s / 3600)}h`);
    if (s < 30 * 86400) return T(`${n(s / 86400)} يوم`, `${n(s / 86400)}d`);
    if (s < 365 * 86400) return T(`${n(s / 2592000, 1)} شهر`, `${n(s / 2592000, 1)}mo`);
    return T(`${n(s / 31536000, 1)} سنة`, `${n(s / 31536000, 1)}y`);
  };
  const latin = (t) => (t.match(/[A-Za-z]/g) || []).length * 2 > (t.match(/\p{L}/gu) || []).length;
  let card = null, grading = false;
  function tab(name) {
    for (const n of ["talk", "review", "me"]) { $("tab-" + n).setAttribute("aria-selected", String(n === name)); $(n).hidden = n !== name; }
    scrollTo(0, 0);
    if (name === "review") nextCard();
    if (name === "me") { progress(); loadLevels(); }
  }
  for (const n of ["talk", "review", "me"]) $("tab-" + n).addEventListener("click", () => tab(n));
  async function nextCard() {
    let due = null;
    try { due = await (await call("/rest/v1/rpc/due_cards", { p_day: new Date().toLocaleDateString("en-CA"), p_limit: 20 })).json(); } catch (e) {}
    grading = false;
    const waiting = due ? due.new + due.learning + due.review : 0;
    $("badge").hidden = !waiting; $("badge").textContent = waiting > 99 ? "99+" : String(waiting);
    card = due?.cards?.[0] || null;
    $("rv-card").hidden = !card; $("rv-done").hidden = !!card;
    if (!due) { $("rv-done").textContent = T("مقدرتش أجيب الكروت. اتأكد من النت.", "Couldn't load your cards. Check the connection."); $("counts").textContent = ""; return; }
    $("counts").innerHTML = `<span><b>${due.new}</b>${T("جديد", "New")}</span><span><b>${due.learning}</b>${T("بتتعلمه", "Learning")}</span><span><b>${due.review}</b>${T("مراجعة", "To review")}</span>`;
    if (!card) {
      $("rv-done").textContent = due.total ? T(`خلّصت مراجعة النهارده 🎉 راجعت ${due.reviewed_today} كارت.`, `Done for today 🎉 You reviewed ${due.reviewed_today} cards.`)
        : T("لسه مفيش كروت. الكلمات اللي بتتعلمها في الكلام بتبقى كروت هنا لوحدها.", "No cards yet. Words you learn while talking become cards here by themselves.");
      return;
    }
    $("rv-deck").textContent = card.deck;
    $("rv-front").textContent = card.front; $("rv-front").dir = latin(card.front) ? "ltr" : "auto";
    $("rv-back").textContent = card.back; $("rv-back").dir = latin(card.back) ? "ltr" : "auto";
    $("rv-hear").hidden = !(ofDeck(card.deck) && card.kind === "word");
    $("rv-answer").hidden = true; $("rv-show").hidden = false; $("rv-show").textContent = T("وريني الإجابة", "Show answer");
    const names = [T("تاني", "Again"), T("صعب", "Hard"), T("تمام", "Good"), T("سهل", "Easy")];
    $("rv-grades").innerHTML = "";
    names.forEach((name, i) => {
      const b = document.createElement("button"); b.type = "button";
      b.innerHTML = `${name}<small>${wait(card.next[i] || 0)}</small>`;
      b.addEventListener("click", () => grade(i + 1));
      $("rv-grades").appendChild(b);
    });
  }
  async function grade(g) {
    if (!card || grading) return;
    grading = true;
    try { await call("/rest/v1/rpc/review_card", { p_id: card.id, p_grade: g, p_day: new Date().toLocaleDateString("en-CA") }); } catch (e) {}
    nextCard();
  }
  $("barge").addEventListener("change", (e) => { store.set("mared-talk-barge", e.target.checked); paint(); });
  $("over").addEventListener("click", () => { store.set("mared-talk-barge", !barge()); paint(); });
  $("rv-show").addEventListener("click", () => { $("rv-answer").hidden = false; $("rv-show").hidden = true; });
  $("rv-hear").addEventListener("click", () => { sound(); speak(card.front, (ofDeck(card.deck) || tg())[1], maredVoice((ofDeck(card.deck) || tg())[0])); });
  document.addEventListener("keydown", (e) => {
    if ($("review").hidden || !card || e.target.tagName === "INPUT") return;
    if ($("rv-answer").hidden) { if (e.key === " " || e.key === "Enter") { e.preventDefault(); $("rv-show").click(); } return; }
    const g = { "1": 1, "2": 2, "3": 3, "4": 4, " ": 3, Enter: 3 }[e.key];
    if (g) { e.preventDefault(); grade(g); }
  });

  paint();
  db.auth.getSession().then(({ data }) => { session = data.session; $("s-in").hidden = !!session; $("s-talk").hidden = !session; if (session) { progress(); nextCard(); loadPeople(); } });
})();
</script>
</body>
</html>
